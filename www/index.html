function fieldStyle(theme) {
  return { width: '100%', background: theme.surface2, border: 'none', borderRadius: 10, padding: '10px 11px', color: theme.text, fontSize: 13, outline: 'none', boxSizing: 'border-box' };
}

/** The account page's actual content — split out from InfoSheet because it
 *  has three real states worth keeping visually distinct: backend not
 *  connected yet (local-only editor, same as before Supabase was wired),
 *  connected but signed out (sign up / log in), and signed in (profile
 *  editor + activity stats + log out). */
function VerifiedBadge({ size = 14 }) {
  return <BadgeCheck size={size} color="#fff" fill="#3B82F6" strokeWidth={1.5} style={{ flexShrink: 0 }} />;
}

// A designated role label (Founder, Creator, etc.) — set only by you, in
// Table Editor, same as the verified checkmark. Deliberately uses a solid
// fill rather than a tinted/translucent one — same choice as the "Soon"
// badge on the Live Session card — so it stays legible sitting on top of
// the blur on glassmorphism, and doesn't blend into the matching
// background neumorphism panels use for their own depth effect. A soft
// shadow is layered on top per skin purely for polish, not for contrast.
function RoleBadge({ label, theme, skin }) {
  if (!label) return null;
  const shadow = skin === 'neu'
    ? '2px 2px 5px var(--neu-dark), -1px -1px 3px var(--neu-light)'
    : skin === 'glass'
      ? `0 1px 4px ${theme.accent}66`
      : 'none';
  return (
    <span style={{
      display: 'inline-flex', alignItems: 'center', gap: 3, flexShrink: 0,
      background: theme.accent, color: theme.bg,
      borderRadius: 999, padding: '2px 8px 2px 6px', fontSize: 10, fontWeight: 800, letterSpacing: 0.3, textTransform: 'uppercase',
      boxShadow: shadow,
    }}><Crown size={10} />{label}</span>
  );
}

function VinylistAccountPanel({
  theme, skin, supabaseConnected, session, profile, onlinePlayCount, songCount,
  onSignUp, onSignIn, onSignOut, onSaveProfile, onRequestVerification,
  accountName, setAccountName, accountBio, setAccountBio, accountUsername, setAccountUsername,
}) {
  const signedIn = !!session?.user;
  const [authMode, setAuthMode] = useState('signin'); // 'signin' | 'signup'
  const [email, setEmail] = useState('');
  const [password, setPassword] = useState('');
  const [suUsername, setSuUsername] = useState('');
  const [suDisplayName, setSuDisplayName] = useState('');
  const [busy, setBusy] = useState(false);
  const [authError, setAuthError] = useState('');
  const [authNotice, setAuthNotice] = useState('');
  const [followCounts, setFollowCounts] = useState({ followers: 0, following: 0 });
  const [requestingVerify, setRequestingVerify] = useState(false);

  const [draftUsername, setDraftUsername] = useState(accountUsername || '');
  const [draftName, setDraftName] = useState(accountName || '');
  const [draftBio, setDraftBio] = useState(accountBio || '');
  useEffect(() => { setDraftUsername(accountUsername || ''); setDraftName(accountName || ''); setDraftBio(accountBio || ''); }, [profile, accountUsername, accountName, accountBio]);

  useEffect(() => {
    if (!session?.user) return;
    fetchFollowCounts(session.user.id).then(setFollowCounts);
  }, [session]);

  const intro = (
    <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', marginBottom: 22 }}>
      <div style={{ width: 72, height: 72, borderRadius: '50%', background: `linear-gradient(135deg, ${theme.accent2}, ${theme.accent})`, display: 'flex', alignItems: 'center', justifyContent: 'center', marginBottom: 10 }}>
        <User size={30} color={theme.bg} />
      </div>
      {signedIn && (
        <div style={{ display: 'flex', alignItems: 'center', gap: 5, marginBottom: 2, flexWrap: 'wrap', justifyContent: 'center' }}>
          <span style={{ fontWeight: 700, fontSize: 13.5 }}>{accountName || accountUsername || 'Your account'}</span>
          {profile?.is_verified && <VerifiedBadge />}
          {profile?.role_label && <RoleBadge label={profile.role_label} theme={theme} skin={skin} />}
        </div>
      )}
      <div style={{ fontSize: 11.5, color: theme.muted, textAlign: 'center', maxWidth: 280, lineHeight: 1.5 }}>
        This is your Vinylist account — it's entirely optional, and only powers the <strong style={{ color: theme.text }}>Online</strong> side of your Library tab. It has nothing to do with your local music — that stays private on this device, tracked separately in Report.
      </div>
    </div>
  );

  const activityCard = (
    <div className={skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined} style={{ background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : theme.surface2, borderRadius: 12, padding: '13px 14px', marginBottom: 16 }}>
      <div style={{ fontSize: 11, color: theme.muted, marginBottom: 4 }}>Your Vinylist activity</div>
      <div style={{ fontSize: 20, fontWeight: 800 }}>{onlinePlayCount || 0}</div>
      <div style={{ fontSize: 11, color: theme.muted, marginBottom: 10 }}>play{onlinePlayCount === 1 ? '' : 's'} on the Online tab — separate from your {songCount} local track{songCount !== 1 ? 's' : ''}, which Report tracks on its own.</div>
      <div style={{ display: 'flex', gap: 18, paddingTop: 10, borderTop: `1px solid ${theme.surface}` }}>
        <div><span style={{ fontWeight: 800, fontSize: 14 }}>{followCounts.followers}</span> <span style={{ fontSize: 11.5, color: theme.muted }}>follower{followCounts.followers === 1 ? '' : 's'}</span></div>
        <div><span style={{ fontWeight: 800, fontSize: 14 }}>{followCounts.following}</span> <span style={{ fontSize: 11.5, color: theme.muted }}>following</span></div>
      </div>
    </div>
  );

  const verificationCard = (
    <div className={skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined} style={{ background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : theme.surface2, borderRadius: 12, padding: '13px 14px', marginBottom: 16 }}>
      {profile?.is_verified ? (
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <VerifiedBadge size={18} />
          <div style={{ fontSize: 12.5, fontWeight: 700 }}>Verified account</div>
        </div>
      ) : profile?.verification_requested_at ? (
        <div>
          <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 3 }}>Verification requested</div>
          <div style={{ fontSize: 11, color: theme.muted, lineHeight: 1.5 }}>Sent {relativeTime(new Date(profile.verification_requested_at).getTime())} — pending review.</div>
        </div>
      ) : (
        <div>
          <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 3 }}>Get verified</div>
          <div style={{ fontSize: 11, color: theme.muted, lineHeight: 1.5, marginBottom: 10 }}>Request a verified badge for your account.</div>
          <button
            onClick={async () => { setRequestingVerify(true); await onRequestVerification?.(); setRequestingVerify(false); }}
            disabled={requestingVerify}
            className="press"
            style={{ display: 'flex', alignItems: 'center', gap: 6, background: theme.accent, color: theme.bg, border: 'none', borderRadius: 8, padding: '8px 12px', fontSize: 12, fontWeight: 700, cursor: 'pointer' }}
          ><BadgeCheck size={14} /> {requestingVerify ? 'Sending\u2026' : 'Request verification'}</button>
        </div>
      )}
    </div>
  );

  if (!supabaseConnected) {
    return (
      <div>
        {intro}
        <div style={{ fontSize: 11, color: theme.muted, background: theme.surface2, borderRadius: 10, padding: '9px 11px', marginBottom: 16, lineHeight: 1.5 }}>
          Vinylist's backend isn't connected in this build yet, so this is a local-only stand-in — nothing here syncs anywhere.
        </div>
        <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 8 }}>Username</div>
        <input value={draftUsername} onChange={e => setDraftUsername(e.target.value.replace(/\s+/g, '').toLowerCase())} placeholder="username" style={fieldStyle(theme)} />
        <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 8, marginTop: 14 }}>Display name</div>
        <input value={draftName} onChange={e => setDraftName(e.target.value)} placeholder="Your name" style={fieldStyle(theme)} />
        <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 8, marginTop: 14 }}>Bio</div>
        <textarea value={draftBio} onChange={e => setDraftBio(e.target.value)} placeholder="A short line about your taste in music" style={{ ...fieldStyle(theme), minHeight: 70, resize: 'vertical', fontFamily: 'inherit' }} />
        <button onClick={() => { setAccountName(draftName.trim()); setAccountBio(draftBio.trim()); setAccountUsername(draftUsername.trim()); }} className="press" style={{ width: '100%', background: theme.accent, color: theme.bg, border: 'none', borderRadius: 10, padding: '11px 0', fontSize: 13, fontWeight: 700, cursor: 'pointer', marginTop: 16 }}>Save</button>
      </div>
    );
  }

  if (signedIn) {
    const handleSave = async () => {
      setBusy(true);
      await onSaveProfile({ username: draftUsername.trim() || undefined, displayName: draftName.trim(), bio: draftBio.trim() });
      setBusy(false);
    };
    return (
      <div>
        {intro}
        <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 8 }}>Username</div>
        <div style={{ position: 'relative', marginBottom: 14 }}>
          <AtSign size={14} color={theme.muted} style={{ position: 'absolute', left: 11, top: '50%', transform: 'translateY(-50%)' }} />
          <input value={draftUsername} onChange={e => setDraftUsername(e.target.value.replace(/\s+/g, '').toLowerCase())} style={{ ...fieldStyle(theme), paddingLeft: 30 }} />
        </div>
        <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 8 }}>Display name</div>
        <input value={draftName} onChange={e => setDraftName(e.target.value)} placeholder="Your name" style={fieldStyle(theme)} />
        <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 8, marginTop: 14 }}>Bio</div>
        <textarea value={draftBio} onChange={e => setDraftBio(e.target.value)} placeholder="A short line about your taste in music" style={{ ...fieldStyle(theme), minHeight: 70, resize: 'vertical', fontFamily: 'inherit' }} />
        <button onClick={handleSave} disabled={busy} className="press" style={{ width: '100%', background: theme.accent, color: theme.bg, border: 'none', borderRadius: 10, padding: '11px 0', fontSize: 13, fontWeight: 700, cursor: 'pointer', marginTop: 16, marginBottom: 16 }}>{busy ? 'Saving\u2026' : 'Save'}</button>

        {activityCard}
        {verificationCard}

        <button onClick={onSignOut} className="press" style={{ width: '100%', background: 'transparent', color: theme.muted, border: `1px solid ${theme.surface2}`, borderRadius: 10, padding: '10px 0', fontSize: 12.5, fontWeight: 600, cursor: 'pointer' }}>Log out</button>
      </div>
    );
  }

  const submit = async () => {
    setAuthError(''); setAuthNotice('');
    if (!email.trim() || !password) { setAuthError('Email and password are required.'); return; }
    if (authMode === 'signup' && !suUsername.trim()) { setAuthError('Pick a username.'); return; }
    setBusy(true);
    const res = authMode === 'signup'
      ? await onSignUp({ email: email.trim(), password, username: suUsername.trim(), displayName: suDisplayName.trim() })
      : await onSignIn({ email: email.trim(), password });
    setBusy(false);
    if (!res.ok) { setAuthError(res.error || 'Something went wrong.'); return; }
    if (res.needsEmailConfirm) setAuthNotice('Account created \u2014 check your email to confirm, then log in.');
  };

  return (
    <div>
      {intro}
      <div style={{ display: 'flex', gap: 6, marginBottom: 18, background: theme.surface2, borderRadius: 10, padding: 3 }}>
        {['signin', 'signup'].map(m => (
          <button key={m} onClick={() => { setAuthMode(m); setAuthError(''); setAuthNotice(''); }} className="press" style={{
            flex: 1, background: authMode === m ? theme.accent : 'transparent', color: authMode === m ? theme.bg : theme.text,
            border: 'none', borderRadius: 8, padding: '8px 0', fontSize: 12.5, fontWeight: 700, cursor: 'pointer',
          }}>{m === 'signin' ? 'Log in' : 'Sign up'}</button>
        ))}
      </div>

      {authMode === 'signup' && (
        <>
          <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 8 }}>Username</div>
          <div style={{ position: 'relative', marginBottom: 14 }}>
            <AtSign size={14} color={theme.muted} style={{ position: 'absolute', left: 11, top: '50%', transform: 'translateY(-50%)' }} />
            <input value={suUsername} onChange={e => setSuUsername(e.target.value.replace(/\s+/g, '').toLowerCase())} placeholder="username" style={{ ...fieldStyle(theme), paddingLeft: 30 }} />
          </div>
          <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 8 }}>Display name <span style={{ opacity: 0.6 }}>(optional)</span></div>
          <input value={suDisplayName} onChange={e => setSuDisplayName(e.target.value)} placeholder="Your name" style={fieldStyle(theme)} />
        </>
      )}

      <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 8, marginTop: authMode === 'signup' ? 14 : 0 }}>Email</div>
      <input type="email" value={email} onChange={e => setEmail(e.target.value)} placeholder="you@example.com" style={fieldStyle(theme)} />
      <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 8, marginTop: 14 }}>Password</div>
      <input type="password" value={password} onChange={e => setPassword(e.target.value)} placeholder={authMode === 'signup' ? 'At least 6 characters' : 'Password'} style={fieldStyle(theme)} />

      {authError && <div style={{ fontSize: 11.5, color: theme.accent, marginTop: 10, lineHeight: 1.5 }}>{authError}</div>}
      {authNotice && <div style={{ fontSize: 11.5, color: theme.muted, marginTop: 10, lineHeight: 1.5 }}>{authNotice}</div>}

      <button onClick={submit} disabled={busy} className="press" style={{ width: '100%', background: theme.accent, color: theme.bg, border: 'none', borderRadius: 10, padding: '11px 0', fontSize: 13, fontWeight: 700, cursor: 'pointer', marginTop: 18 }}>
        {busy ? 'Please wait\u2026' : authMode === 'signup' ? 'Create account' : 'Log in'}
      </button>
    </div>
  );
}

function App() {
  useEffect(() => {
    (async () => {
      try {
        if (window.Capacitor?.isNativePlatform?.()) {
          // Native plugins are reached through the auto-registered bridge
          // (window.Capacitor.Plugins), same pattern as native-media.js —
          // this build has no bundler, so bare ESM imports like
          // `import('@capacitor/splash-screen')` would fail silently here.
          const { SplashScreen, StatusBar } = window.Capacitor.Plugins;
          await StatusBar?.setStyle?.({ style: 'DARK' }).catch(() => {});
          await StatusBar?.setBackgroundColor?.({ color: '#121115' }).catch(() => {});
          setTimeout(() => SplashScreen?.hide?.().catch(() => {}), 400);
        }
      } catch {
        /* Not running inside Capacitor — fine, this is a plain web build. */
      }
    })();
  }, []);

  return (
    <PlayerErrorBoundary>
      <MusicPlayerApp />
    </PlayerErrorBoundary>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(
  <React.StrictMode>
    <App />
  </React.StrictMode>
);
