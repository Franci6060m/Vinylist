            color: theme.accent, background: `${theme.accent}22`, borderRadius: 999,
            padding: '2px 8px', lineHeight: 1.6,
          }}>Coming Soon</span>
        </div>
        <div style={{ fontSize: 11.5, color: theme.muted, marginTop: 3, lineHeight: 1.45 }}>
          Loopin &mdash; social and music platform. Discover new tracks, follow artists and share what you're listening to. Stay tuned.
        </div>
      </div>
    </div>
  );
}

function QueueView({
  theme, skin, songs, currentIndex, playIndex, removeSong, toggleLike,
  search, setSearch, listFilter, setListFilter, playlists,
  fileInputRef, folderInputRef, onDrop, onDragOver, dragIndex, setDragIndex, reorder, isPlaying,
  dragFingerprint, setDragFingerprint, reorderPlaylist,
  setAddToPlaylistFor, newPlaylistName, setNewPlaylistName, createPlaylist, deletePlaylist, restoredCount,
  libraryMode, setLibraryMode, showToast, accountName,
  onlinePlayCount, setOnlinePlayCount, session,
}) {
  const [highlightIdx, setHighlightIdx] = useState(null);

  const filters = [
    { id: 'all', label: 'All Songs' },
    { id: 'favorites', label: 'Favorites' },
    { id: 'albums', label: 'Albums' },
    { id: 'recent', label: 'Recently Added' },
    { id: 'recentlyPlayed', label: 'Recently Played' },
    { id: 'played', label: 'Most Played' },
    { id: 'playlists', label: 'Playlists' },
  ];

  const isAlbumView = listFilter === 'albums';
  const isPlaylistsHub = listFilter === 'playlists';
  const isSinglePlaylist = listFilter.startsWith('playlist:');
  const activePlaylist = isSinglePlaylist ? playlists.find(p => 'playlist:' + p.id === listFilter) : null;
  // Order only reflects something meaningful to drag in these views — the
  // rest are either sorted by date/plays (recomputed every render, so a
  // drag would just snap back) or grouped by album.
  const draggableEnabled = listFilter === 'all' || listFilter === 'favorites' || isSinglePlaylist;

  const albumGroups = useMemo(() => {
    if (!isAlbumView) return null;
    const map = new Map();
    songs.forEach(s => {
      const key = s.album || 'Unknown Album';
      if (!map.has(key)) map.set(key, []);
      map.get(key).push(s);
    });
    return [...map.entries()];
  }, [songs, isAlbumView]);

  // "Locate current song": jump to All Songs (guaranteed to contain it,
  // clears any active search) and scroll/flash the row into view once it's
  // rendered.
  const locateCurrentSong = () => {
    if (currentIndex < 0) return;
    setListFilter('all');
    setSearch('');
    setHighlightIdx(currentIndex);
  };
  useEffect(() => {
    if (highlightIdx == null) return;
    const el = document.querySelector(`[data-song-idx="${highlightIdx}"]`);
    el?.scrollIntoView({ behavior: 'smooth', block: 'center' });
    const t = setTimeout(() => setHighlightIdx(null), 1600);
    return () => clearTimeout(t);
  }, [highlightIdx, listFilter]);

  const handleRowDragStart = (s) => {
    if (isSinglePlaylist) setDragFingerprint(s.fingerprint); else setDragIndex(s._idx);
  };
  const handleRowDrop = (s) => {
    if (isSinglePlaylist) {
      if (dragFingerprint !== null && dragFingerprint !== s.fingerprint) reorderPlaylist(activePlaylist.id, dragFingerprint, s.fingerprint);
      setDragFingerprint(null);
    } else {
      if (dragIndex !== null && dragIndex !== s._idx) reorder(dragIndex, s._idx);
      setDragIndex(null);
    }
  };

  return (
    <div className="fade-up" onDrop={onDrop} onDragOver={onDragOver}>
      <LoopinPromo theme={theme} skin={skin} />

      <div className={skin === 'neu' ? 'neupanel-inset' : undefined} style={{ display: 'flex', gap: 4, marginBottom: 14, background: skin === 'neu' ? 'var(--neu-bg)' : theme.surface2, borderRadius: 999, padding: 4 }}>
        {[{ id: 'local', label: 'Local', Icon: HardDrive }, { id: 'online', label: 'Online', Icon: Globe }].map(({ id, label, Icon }) => {
          const active = libraryMode === id;
          return (
            <button key={id} onClick={() => setLibraryMode(id)} className="press" style={{
              flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', gap: 6,
              background: active ? theme.accent : 'transparent', color: active ? theme.bg : theme.text,
              border: 'none', borderRadius: 999, padding: '9px 0', fontSize: 12.5, fontWeight: 700, cursor: 'pointer',
            }}><Icon size={14} /> {label}</button>
          );
        })}
      </div>

      {libraryMode === 'online' ? (
        <OnlineLibraryView theme={theme} skin={skin} showToast={showToast} accountName={accountName}
          onlinePlayCount={onlinePlayCount} setOnlinePlayCount={setOnlinePlayCount} session={session} />
      ) : (
      <>
      {restoredCount > 0 && songs.length === 0 && (
        <div style={{ fontSize: 11.5, color: theme.muted, background: `${theme.surface}dd`, borderRadius: 12, padding: '10px 12px', marginTop: 12, marginBottom: 4 }}>
          Found saved info for {restoredCount} previously-added track{restoredCount !== 1 ? 's' : ''}, but the audio itself was cleared from storage — rescan the same folder to relink them.
        </div>
      )}
      <div style={{ display: 'flex', gap: 8, marginTop: 12, marginBottom: 14 }}>
        <div className={skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined} style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 8, background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`, borderRadius: 12, padding: '9px 12px' }}>
          <Search size={16} color={theme.muted} />
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search title, artist, album" style={{ flex: 1, background: 'none', border: 'none', outline: 'none', color: theme.text, fontSize: 13.5 }} />
        </div>
        <button
          onClick={locateCurrentSong} disabled={currentIndex < 0} title="Jump to current song"
          className={`press ${skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : ''}`}
          style={{
            background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`,
            color: theme.text, border: 'none', borderRadius: 12, width: 42, flexShrink: 0,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            cursor: currentIndex < 0 ? 'default' : 'pointer', opacity: currentIndex < 0 ? 0.4 : 1,
          }}
        ><LocateFixed size={18} /></button>
        <button onClick={() => folderInputRef.current?.click()} className="press" style={{ background: theme.accent, color: theme.bg, border: 'none', borderRadius: 12, width: 42, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }} title="Scan folder"><FolderOpen size={18} /></button>
        <button onClick={() => fileInputRef.current?.click()} className="press" style={{ background: theme.surface2, color: theme.text, border: 'none', borderRadius: 12, width: 42, display: 'flex', alignItems: 'center', justifyContent: 'center', cursor: 'pointer' }} title="Add files"><Plus size={19} /></button>
      </div>

      <div style={{ display: 'flex', gap: 7, marginBottom: 16, overflowX: 'auto', paddingBottom: 4 }}>
        {filters.map(f => {
          const active = f.id === listFilter || (f.id === 'playlists' && isSinglePlaylist);
          return (
            <button key={f.id} onClick={() => setListFilter(f.id)} className={`press ${skin === 'glass' && !active ? 'glasspanel-lite' : skin === 'neu' && !active ? 'neupanel-lite' : ''}`} style={{ background: active ? theme.accent : (skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`), color: active ? theme.bg : theme.text, border: 'none', borderRadius: 999, padding: '7px 14px', fontSize: 12, fontWeight: 600, cursor: 'pointer', whiteSpace: 'nowrap', flexShrink: 0 }}>
              {f.label}
            </button>
          );
        })}
      </div>

      {isPlaylistsHub ? (
        <PlaylistsHub theme={theme} skin={skin} playlists={playlists} setListFilter={setListFilter} deletePlaylist={deletePlaylist}
          newPlaylistName={newPlaylistName} setNewPlaylistName={setNewPlaylistName} createPlaylist={createPlaylist} />
      ) : (
        <>
          {isSinglePlaylist && (
            <button onClick={() => setListFilter('playlists')} className="press" style={{ display: 'flex', alignItems: 'center', gap: 6, background: 'none', border: 'none', color: theme.muted, cursor: 'pointer', fontSize: 12.5, fontWeight: 600, padding: '0 2px', marginBottom: 10 }}>
              <ArrowLeft size={14} /> Playlists {activePlaylist ? `· ${activePlaylist.name}` : ''}
            </button>
          )}

          {songs.length === 0 ? (
            <div style={{ color: theme.muted, fontSize: 13, textAlign: 'center', padding: '40px 10px' }}>
              {isAlbumView ? 'No albums yet — add some tracks first.' : listFilter === 'recentlyPlayed' ? 'Nothing played yet this session.' : isSinglePlaylist ? 'No tracks in this playlist yet.' : 'Nothing here yet.'}
            </div>
          ) : isAlbumView ? (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
              {albumGroups.map(([albumName, tracks]) => (
                <div key={albumName}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6, padding: '0 4px' }}>
                    <Disc3 size={13} color={theme.muted} />
                    <span style={{ fontSize: 12.5, fontWeight: 700, color: theme.muted }}>{albumName}</span>
                    <span style={{ fontSize: 11, color: theme.muted, opacity: 0.7 }}>· {tracks.length} track{tracks.length !== 1 ? 's' : ''}</span>
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                    {tracks.map(s => (
                      <SongRow key={s.id} s={s} theme={theme} skin={skin} currentIndex={currentIndex} isPlaying={isPlaying}
                        playIndex={playIndex} onRowDragStart={handleRowDragStart} onRowDrop={handleRowDrop}
                        setAddToPlaylistFor={setAddToPlaylistFor} toggleLike={toggleLike} removeSong={removeSong}
                        draggable={false} highlighted={s._idx === highlightIdx} />
                    ))}
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
              {songs.map((s) => (
                <SongRow key={s.id} s={s} theme={theme} skin={skin} currentIndex={currentIndex} isPlaying={isPlaying}
                  playIndex={playIndex} onRowDragStart={handleRowDragStart} onRowDrop={handleRowDrop}
                  setAddToPlaylistFor={setAddToPlaylistFor} toggleLike={toggleLike} removeSong={removeSong}
                  draggable={draggableEnabled} highlighted={s._idx === highlightIdx} />
              ))}
            </div>
          )}
        </>
      )}
      </>
      )}
    </div>
  );
}

/** Online side of the Library tab — a shared feed of tracks/playlists other
 *  Vinylist users have uploaded, with an "Upload your track" entry point
 *  (top right, next to the search bar) that opens a hub matching the
 *  Track / Playlist / Live session picker this was designed from. See the
 *  SECTION 1B comment above for the backend story: this reads/writes a
 *  real shared feed where one is available and degrades to a per-device
 *  feed otherwise, so the UI works everywhere but only actually shares
 *  with other people once a backend is behind it. */
// Native share sheet where available, clipboard copy as the fallback —
// used for sharing an online playlist (or track) outside the app.
async function shareOnlineItem(item, showToast) {
  const kind = item.type === 'playlist' ? 'playlist' : 'track';
  const by = item.uploader ? ` by ${item.uploader}` : '';
  const text = kind === 'playlist'
    ? `"${item.title}"${by} \u2014 a playlist on Vinylist (${item.tracks?.length || 0} tracks). Free music from independent artists.`
    : `"${item.title}" by ${item.artist} \u2014 on Vinylist. Free music from independent artists.`;
  if (navigator.share) {
    try { await navigator.share({ title: item.title, text }); return; }
    catch { /* user cancelled the share sheet — not an error */ }
  } else {
    try { await navigator.clipboard.writeText(text); showToast?.('Copied to clipboard'); }
    catch { showToast?.('Could not share'); }
  }
}

function OnlineLibraryView({ theme, skin, showToast, accountName, onlinePlayCount, setOnlinePlayCount, session }) {
  const [feed, setFeed] = useState([]);
  const [feedLoading, setFeedLoading] = useState(true);
  const [feedShared, setFeedShared] = useState(true); // whether this is a genuinely shared feed
  const [uploading, setUploading] = useState(false);
  const [search, setSearch] = useState('');
  const [hubOpen, setHubOpen] = useState(false);
  const [peopleOpen, setPeopleOpen] = useState(false);
  const [activeForm, setActiveForm] = useState(null); // 'track' | 'playlist' | 'live' | null
  const [openPlaylist, setOpenPlaylist] = useState(null);
  const [bannerDismissed, setBannerDismissed] = useState(() => {
    try { return window.localStorage.getItem('vinylist-online-banner-seen') === '1'; } catch { return false; }
  });
  // Only used for the local-only fallback path (no backend, or signed out) —
  // lets someone preview their own just-made upload this session even
  // though it isn't really shared anywhere yet.
  const localAudioRef = useRef(new Map());

  const refreshFeed = useCallback(async () => {
    setFeedLoading(true);
    if (supabaseClient) {
      const items = await loadOnlineFeedReal();
      setFeedShared(true);
      setFeed(items);
    } else {
      const s = await sharedFeedStorage();
      const items = await loadOnlineFeed();
      setFeedShared(!!s);
      setFeed(items);
    }
    setFeedLoading(false);
  }, []);

  useEffect(() => { refreshFeed(); }, [refreshFeed]);
  useEffect(() => {
    const map = localAudioRef.current;
    return () => map.forEach(url => URL.revokeObjectURL(url));
  }, []);

  const dismissBanner = () => {
    setBannerDismissed(true);
    try { window.localStorage.setItem('vinylist-online-banner-seen', '1'); } catch {}
  };

  const handleUploadClick = () => {
    if (supabaseClient && !session?.user) { showToast?.('Sign in from Settings \u2192 Account to upload'); return; }
    setHubOpen(true);
  };
  const handleHubSelect = (id) => { setHubOpen(false); setActiveForm(id); };

  // item/files come from TrackUploadSheet / PlaylistUploadSheet exactly as
  // before — this just decides where they actually go: real Postgres+R2
  // when there's a backend and a signed-in user, the old local-only stand-in
  // otherwise (offline demo, or backend connected but not signed in).
  const handleSubmit = async (item, files) => {
    const canUseBackend = !!(supabaseClient && session?.user);
    if (!canUseBackend) {
      if (files?.[0]) localAudioRef.current.set(item.id, URL.createObjectURL(files[0]));
      const res = await pushOnlineItem(item);
      setFeed(prev => [item, ...prev]);
      setActiveForm(null);
      if (!res.ok) showToast?.("Couldn't save that upload \u2014 try again");
      else if (!supabaseClient) showToast?.('Saved on this device \u2014 connect a backend to share with other Vinylist users');
      else showToast?.('Sign in from Settings \u2192 Account to share with other Vinylist users');
      return;
    }

    setActiveForm(null);
    setUploading(true);
    try {
      if (item.type === 'track') {
        const audioFile = files?.[0];
        if (!audioFile) throw new Error('Missing audio file.');
        const audioUp = await uploadFileToR2(audioFile, 'audio');
        if (!audioUp.ok) throw new Error(audioUp.error || 'Audio upload failed.');
        let coverUrl = null;
        if (item.cover) {
          const coverBlob = await dataUrlToBlob(item.cover);
          if (coverBlob) {
            const coverUp = await uploadFileToR2(new File([coverBlob], 'cover.jpg', { type: 'image/jpeg' }), 'cover');
            if (coverUp.ok) coverUrl = coverUp.publicUrl;
          }
        }
        const { error } = await supabaseClient.from('tracks').insert({
          uploader_id: session.user.id, title: item.title, artist: item.artist,
          album: item.album || null, description: item.description || null,
          audio_url: audioUp.publicUrl, cover_url: coverUrl,
        });
        if (error) throw new Error(error.message);
        showToast?.('Track shared to Vinylist');
      } else if (item.type === 'playlist') {
        let coverUrl = null;
        if (item.cover) {
          const coverBlob = await dataUrlToBlob(item.cover);
          if (coverBlob) {
            const coverUp = await uploadFileToR2(new File([coverBlob], 'cover.jpg', { type: 'image/jpeg' }), 'cover');
            if (coverUp.ok) coverUrl = coverUp.publicUrl;
          }
        }
        const { data: playlistRow, error: plErr } = await supabaseClient.from('playlists')
          .insert({ owner_id: session.user.id, title: item.title, description: item.description || null, cover_url: coverUrl })
          .select().single();
        if (plErr || !playlistRow) throw new Error(plErr?.message || 'Could not create the playlist.');

        let failedTracks = 0;
        for (let i = 0; i < (item.tracks || []).length; i++) {
          const t = item.tracks[i];
          const file = files?.[i];
          if (!file) { failedTracks++; continue; }
          const audioUp = await uploadFileToR2(file, 'audio');
          if (!audioUp.ok) { failedTracks++; continue; }
          const { data: trackRow, error: trErr } = await supabaseClient.from('tracks')
            .insert({ uploader_id: session.user.id, title: t.title, artist: t.artist, audio_url: audioUp.publicUrl })
            .select().single();
          if (trErr || !trackRow) { failedTracks++; continue; }
          await supabaseClient.from('playlist_tracks').insert({ playlist_id: playlistRow.id, track_id: trackRow.id, position: i });
        }
        showToast?.(failedTracks ? `Playlist shared \u2014 ${failedTracks} track${failedTracks === 1 ? '' : 's'} failed` : 'Playlist shared to Vinylist');
      }
      await refreshFeed();
    } catch (err) {
      showToast?.(err.message || "Couldn't finish that upload");
    } finally {
      setUploading(false);
    }
  };

  const handlePlay = () => setOnlinePlayCount?.(c => (c || 0) + 1);

  const filteredFeed = useMemo(() => {
    const q = search.trim().toLowerCase();
    if (!q) return feed;
    return feed.filter(it => it.title?.toLowerCase().includes(q) || it.artist?.toLowerCase().includes(q) || it.uploader?.toLowerCase().includes(q));
  }, [feed, search]);

  const panelBg = skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`;
  const panelClass = skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined;

  return (
    <div className="fade-up">
      <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
        <div className={panelClass} style={{ flex: 1, minWidth: 0, display: 'flex', alignItems: 'center', gap: 8, background: panelBg, borderRadius: 12, padding: '9px 12px' }}>
          <Search size={16} color={theme.muted} />
          <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search Vinylist uploads" style={{ flex: 1, minWidth: 0, background: 'none', border: 'none', outline: 'none', color: theme.text, fontSize: 13.5 }} />
        </div>
        <IconButton theme={theme} skin={skin} label="Find people" onClick={() => setPeopleOpen(true)}><Users size={17} /></IconButton>
        <button onClick={handleUploadClick} disabled={uploading} className="press" title="Upload your track" style={{
          display: 'flex', alignItems: 'center', gap: 6, background: uploading ? theme.surface2 : theme.accent, color: uploading ? theme.muted : theme.bg, border: 'none',
          borderRadius: 12, padding: '0 14px', fontSize: 12.5, fontWeight: 700, cursor: uploading ? 'default' : 'pointer', flexShrink: 0,
        }}><CloudUpload size={16} /> {uploading ? 'Uploading\u2026' : 'Upload'}</button>
      </div>

      {!bannerDismissed && (
        <div className={panelClass} style={{ display: 'flex', gap: 10, background: panelBg, borderRadius: 14, padding: '13px 14px', marginBottom: 14 }}>
          <Info size={17} color={theme.accent} style={{ flexShrink: 0, marginTop: 1 }} />
          <div style={{ flex: 1 }}>
            <div style={{ fontSize: 12.5, fontWeight: 700, marginBottom: 3 }}>Free music, by independent artists</div>
            <div style={{ fontSize: 11.5, color: theme.muted, lineHeight: 1.55 }}>
              Everything here is uploaded directly by independent musicians and creators \u2014 some you may already know, many you're about to discover. This tab exists to help people find and support them.
            </div>
          </div>
          <button onClick={dismissBanner} className="press" style={{ background: 'none', border: 'none', color: theme.muted, cursor: 'pointer', padding: 2, flexShrink: 0 }}><X size={15} /></button>
        </div>
      )}

      {!feedLoading && !feedShared && (
        <div style={{ fontSize: 11, color: theme.muted, background: panelBg, borderRadius: 10, padding: '9px 11px', marginBottom: 14, lineHeight: 1.5 }}>
          Sharing with other Vinylist users needs a backend that isn't connected yet, so uploads are only saved on this device for now.
        </div>
      )}

      {feedLoading ? (
        <div style={{ color: theme.muted, fontSize: 13, textAlign: 'center', padding: '40px 10px' }}>Loading uploads…</div>
      ) : filteredFeed.length === 0 ? (
        <div className={panelClass} style={{ background: panelBg, borderRadius: 16, padding: '28px 18px', textAlign: 'center' }}>
          <Globe size={26} color={theme.accent} style={{ marginBottom: 10 }} />
          <div style={{ fontWeight: 700, fontSize: 14, marginBottom: 6 }}>{search ? 'No matches' : 'Nothing uploaded yet'}</div>
          <div style={{ fontSize: 12, color: theme.muted, lineHeight: 1.6, maxWidth: 300, margin: '0 auto' }}>
            {search ? 'Try a different search.' : 'Be the first to share a track or playlist with Vinylist.'}
          </div>
        </div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
          {filteredFeed.map(item => (
            <OnlineFeedRow key={item.id} item={item} theme={theme} skin={skin}
              localUrl={localAudioRef.current.get(item.id) || null}
              onOpen={() => { if (item.type === 'playlist') setOpenPlaylist(item); }}
              onPlay={handlePlay}
              showToast={showToast} />
          ))}
        </div>
      )}

      {hubOpen && <UploadHubSheet theme={theme} skin={skin} onClose={() => setHubOpen(false)} onSelect={handleHubSelect} />}
      {activeForm === 'track' && <TrackUploadSheet theme={theme} skin={skin} accountName={accountName} onClose={() => setActiveForm(null)} onSubmit={handleSubmit} />}
      {activeForm === 'playlist' && <PlaylistUploadSheet theme={theme} skin={skin} accountName={accountName} onClose={() => setActiveForm(null)} onSubmit={handleSubmit} />}
      {activeForm === 'live' && <LiveSessionComingSoonSheet theme={theme} skin={skin} onClose={() => setActiveForm(null)} />}
      {openPlaylist && <PlaylistPreviewSheet item={openPlaylist} theme={theme} skin={skin} onClose={() => setOpenPlaylist(null)} showToast={showToast} />}
      {peopleOpen && <PeopleSearchSheet theme={theme} skin={skin} session={session} showToast={showToast} onClose={() => setPeopleOpen(false)} />}
    </div>
  );
}

/** One row in the online feed — a track (playable if it has a real remote
 *  audioUrl from the backend, or a local preview if it was just uploaded
 *  this session without a backend) or a playlist (tap to see what's in
 *  it). Both types can be shared outside the app via the share icon. */
function OnlineFeedRow({ item, theme, skin, localUrl, onOpen, onPlay, showToast }) {
  const [playing, setPlaying] = useState(false);
  const audioRef = useRef(null);
  const isPlaylist = item.type === 'playlist';
  const playSrc = localUrl || item.audioUrl || null;
  const canPlay = !isPlaylist && !!playSrc;

  useEffect(() => () => { audioRef.current?.pause(); }, []);

  const togglePlay = (e) => {
    e.stopPropagation();
    if (!canPlay) { showToast?.('Streaming from other devices needs Vinylist\u2019s backend \u2014 coming soon'); return; }
    if (!audioRef.current) { audioRef.current = new Audio(playSrc); audioRef.current.onended = () => setPlaying(false); }
    if (playing) {
      audioRef.current.pause(); setPlaying(false);
    } else {
      audioRef.current.play(); setPlaying(true); onPlay?.();
      // Only count plays of real backend tracks — a locally-cached preview
      // of your own not-yet-shared upload has no real track id to count.
      if (item.audioUrl && supabaseClient) {
        supabaseClient.rpc('increment_play_count', { track_id_input: item.id }).then(() => {}, () => {});
      }
    }
  };

  const handleShare = (e) => { e.stopPropagation(); shareOnlineItem(item, showToast); };

  return (
    <div onClick={onOpen} className="rowhover" style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 6px', borderRadius: 10, cursor: isPlaylist ? 'pointer' : 'default' }}>
      <div style={{ width: 44, height: 44, borderRadius: 10, flexShrink: 0, overflow: 'hidden', background: `linear-gradient(135deg, ${theme.accent2}, ${theme.accent})`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>

/** Upload form for a single track: cover art, audio file, title/artist
 *  (auto-filled from the file's ID3 tags when present, editable either
 *  way), album and a short description. */
function TrackUploadSheet({ theme, skin, accountName, onClose, onSubmit }) {
  const [audioFile, setAudioFile] = useState(null);
  const [coverFile, setCoverFile] = useState(null);
  const [autoCoverUrl, setAutoCoverUrl] = useState(null); // embedded ID3 art, if any
  const [title, setTitle] = useState('');
  const [artist, setArtist] = useState('');
  const [album, setAlbum] = useState('');
  const [description, setDescription] = useState('');
  const [submitting, setSubmitting] = useState(false);
  const audioInputRef = useRef(null);
  const coverInputRef = useRef(null);

  const coverPreviewUrl = useMemo(() => coverFile ? URL.createObjectURL(coverFile) : null, [coverFile]);
  useEffect(() => () => { if (coverPreviewUrl) URL.revokeObjectURL(coverPreviewUrl); }, [coverPreviewUrl]);
  const displayedCover = coverPreviewUrl || autoCoverUrl;

  const handleAudioPick = async (e) => {
    const file = e.target.files?.[0];
    if (!file) return;
    setAudioFile(file);
    let tags = null;
    try { tags = parseID3(await file.arrayBuffer()); } catch { /* not tagged, or unreadable — fine, fields stay editable */ }
    setTitle(t => t || tags?.title || file.name.replace(/\.[^.]+$/, ''));
    setArtist(a => a || tags?.artist || '');
    setAlbum(al => al || tags?.album || '');
    if (tags?.pictureUrl) setAutoCoverUrl(tags.pictureUrl);
  };
  const handleCoverPick = (e) => { const f = e.target.files?.[0]; if (f) setCoverFile(f); };

  const canSubmit = title.trim() && artist.trim() && audioFile && !submitting;
  const handleSubmit = async () => {
    if (!canSubmit) return;
    setSubmitting(true);
    const cover = coverFile ? await imageSourceToCoverDataUrl(coverFile) : autoCoverUrl ? await imageSourceToCoverDataUrl(autoCoverUrl) : null;
    const item = {
      id: genId(), type: 'track', title: title.trim(), artist: artist.trim(),
      album: album.trim() || null, description: description.trim() || null,
      cover, ts: Date.now(), uploader: accountName || 'Anonymous',
    };
    await onSubmit(item, [audioFile]);
  };

  const panelBg = skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : theme.surface;
  const inputStyle = { width: '100%', background: theme.surface2, border: 'none', borderRadius: 10, padding: '10px 11px', color: theme.text, fontSize: 13, outline: 'none', marginBottom: 12 };

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 121, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 18, background: 'rgba(0,0,0,0.5)' }} onClick={onClose}>
      <div className={`fade-up sheet-panel ${skin === 'glass' ? 'glasspanel' : skin === 'neu' ? 'neupanel' : ''}`} onClick={e => e.stopPropagation()} style={{ width: '100%', maxWidth: 440, maxHeight: '85vh', maxHeight: '85dvh', borderRadius: 20, background: panelBg }}>
        <div className="sheet-header-sticky" style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '20px 20px 16px' }}>
          <IconButton theme={theme} skin={skin} size="sm" label="Back" onClick={onClose}><ArrowLeft size={16} /></IconButton>
          <div style={{ fontWeight: 700, fontSize: 14 }}>Upload a track</div>
        </div>

        <div className="sheet-panel-body" style={{ padding: '0 20px 20px' }}>
        <div style={{ display: 'flex', gap: 12, marginBottom: 16 }}>
          <button onClick={() => coverInputRef.current?.click()} className="press" style={{ width: 72, height: 72, borderRadius: 14, flexShrink: 0, border: 'none', cursor: 'pointer', overflow: 'hidden', background: theme.surface2, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            {displayedCover ? <img src={displayedCover} style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> : <ImagePlus size={22} color={theme.muted} />}
          </button>
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 8, minWidth: 0 }}>
            <div style={{ fontSize: 11, color: theme.muted, lineHeight: 1.4 }}>Cover art (tap to add) · optional — pulled from the file's tags if it has any</div>
            <button onClick={() => audioInputRef.current?.click()} className="press" style={{ display: 'flex', alignItems: 'center', gap: 8, background: theme.surface2, color: theme.text, border: 'none', borderRadius: 10, padding: '9px 12px', fontSize: 12.5, fontWeight: 600, cursor: 'pointer', overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap' }}>
              <Music2 size={14} style={{ flexShrink: 0 }} /> <span style={{ overflow: 'hidden', textOverflow: 'ellipsis' }}>{audioFile ? audioFile.name : 'Choose audio file'}</span>
            </button>
          </div>
        </div>

        <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 6 }}>Song title</div>
        <input style={inputStyle} value={title} onChange={e => setTitle(e.target.value)} placeholder="Song title" />
        <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 6 }}>Artist</div>
        <input style={inputStyle} value={artist} onChange={e => setArtist(e.target.value)} placeholder="Artist name" />
        <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 6 }}>Album <span style={{ opacity: 0.6 }}>(optional)</span></div>
        <input style={inputStyle} value={album} onChange={e => setAlbum(e.target.value)} placeholder="Album" />
        <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 6 }}>Description <span style={{ opacity: 0.6 }}>(optional)</span></div>
        <textarea style={{ ...inputStyle, resize: 'none', minHeight: 60, fontFamily: 'inherit' }} value={description} onChange={e => setDescription(e.target.value)} placeholder="Say something about this track" />

        <div style={{ fontSize: 11, color: theme.muted, lineHeight: 1.6, marginBottom: 14 }}>Only upload music you own or have the rights to share.</div>

        <button onClick={handleSubmit} disabled={!canSubmit} className={canSubmit ? 'press' : undefined} style={{ width: '100%', background: canSubmit ? theme.accent : theme.surface2, color: canSubmit ? theme.bg : theme.muted, border: 'none', borderRadius: 10, padding: '12px 0', fontSize: 13, fontWeight: 700, cursor: canSubmit ? 'pointer' : 'default' }}>
          {submitting ? 'Sharing\u2026' : 'Share to Vinylist'}
        </button>

        <input ref={audioInputRef} type="file" accept="audio/*" style={{ display: 'none' }} onChange={handleAudioPick} />
        <input ref={coverInputRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={handleCoverPick} />
        </div>
      </div>
    </div>
  );
}

/** Upload form for a shared playlist: cover, name, description, then one or
 *  more audio files added as its tracks (each gets ID3-prefilled, editable
 *  title/artist, same as the track form above). */
function PlaylistUploadSheet({ theme, skin, accountName, onClose, onSubmit }) {
  const [coverFile, setCoverFile] = useState(null);
  const [name, setName] = useState('');
  const [description, setDescription] = useState('');
  const [tracks, setTracks] = useState([]); // { id, file, title, artist }
  const [submitting, setSubmitting] = useState(false);
  const coverInputRef = useRef(null);
  const tracksInputRef = useRef(null);

  const coverPreviewUrl = useMemo(() => coverFile ? URL.createObjectURL(coverFile) : null, [coverFile]);
  useEffect(() => () => { if (coverPreviewUrl) URL.revokeObjectURL(coverPreviewUrl); }, [coverPreviewUrl]);

  const handleCoverPick = (e) => { const f = e.target.files?.[0]; if (f) setCoverFile(f); };
  const handleTracksPick = async (e) => {
    const files = Array.from(e.target.files || []);
    e.target.value = '';
    if (files.length === 0) return;
    const added = await Promise.all(files.map(async (file) => {
      let tags = null;
      try { tags = parseID3(await file.arrayBuffer()); } catch {}
      return { id: genId(), file, title: tags?.title || file.name.replace(/\.[^.]+$/, ''), artist: tags?.artist || '' };
    }));
    setTracks(prev => [...prev, ...added]);
  };
  const updateTrack = (id, field, value) => setTracks(prev => prev.map(t => t.id === id ? { ...t, [field]: value } : t));
  const removeTrack = (id) => setTracks(prev => prev.filter(t => t.id !== id));

  const canSubmit = name.trim() && tracks.length > 0 && tracks.every(t => t.title.trim() && t.artist.trim()) && !submitting;
  const handleSubmit = async () => {
    if (!canSubmit) return;
    setSubmitting(true);
    const cover = coverFile ? await imageSourceToCoverDataUrl(coverFile) : null;
    const item = {
      id: genId(), type: 'playlist', title: name.trim(), description: description.trim() || null,
      cover, ts: Date.now(), uploader: accountName || 'Anonymous',
      tracks: tracks.map(t => ({ title: t.title.trim(), artist: t.artist.trim() })),
    };
    await onSubmit(item, tracks.map(t => t.file));
  };

  const panelBg = skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : theme.surface;
  const inputStyle = { width: '100%', background: theme.surface2, border: 'none', borderRadius: 10, padding: '10px 11px', color: theme.text, fontSize: 13, outline: 'none', marginBottom: 12 };
  const trackInputStyle = { background: theme.surface, border: 'none', borderRadius: 8, padding: '6px 8px', color: theme.text, fontSize: 12, outline: 'none', width: '100%' };

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 121, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 18, background: 'rgba(0,0,0,0.5)' }} onClick={onClose}>
      <div className={`fade-up sheet-panel ${skin === 'glass' ? 'glasspanel' : skin === 'neu' ? 'neupanel' : ''}`} onClick={e => e.stopPropagation()} style={{ width: '100%', maxWidth: 440, maxHeight: '85vh', maxHeight: '85dvh', borderRadius: 20, background: panelBg }}>
        <div className="sheet-header-sticky" style={{ display: 'flex', alignItems: 'center', gap: 8, padding: '20px 20px 16px' }}>
          <IconButton theme={theme} skin={skin} size="sm" label="Back" onClick={onClose}><ArrowLeft size={16} /></IconButton>
          <div style={{ fontWeight: 700, fontSize: 14 }}>Upload a playlist</div>
        </div>

        <div className="sheet-panel-body" style={{ padding: '0 20px 20px' }}>
        <div style={{ display: 'flex', gap: 12, marginBottom: 16 }}>
          <button onClick={() => coverInputRef.current?.click()} className="press" style={{ width: 72, height: 72, borderRadius: 14, flexShrink: 0, border: 'none', cursor: 'pointer', overflow: 'hidden', background: theme.surface2, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
            {coverPreviewUrl ? <img src={coverPreviewUrl} style={{ width: '100%', height: '100%', objectFit: 'cover' }} /> : <ImagePlus size={22} color={theme.muted} />}
          </button>
          <div style={{ flex: 1, fontSize: 11, color: theme.muted, lineHeight: 1.4, display: 'flex', alignItems: 'center' }}>Playlist cover (tap to add) · optional</div>
        </div>

        <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 6 }}>Playlist name</div>
        <input style={inputStyle} value={name} onChange={e => setName(e.target.value)} placeholder="Playlist name" />
        <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 6 }}>Description <span style={{ opacity: 0.6 }}>(optional)</span></div>
        <textarea style={{ ...inputStyle, resize: 'none', minHeight: 50, fontFamily: 'inherit' }} value={description} onChange={e => setDescription(e.target.value)} placeholder="What's this playlist about?" />

        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 8 }}>
          <div style={{ fontSize: 11.5, color: theme.muted }}>Tracks · {tracks.length}</div>
          <button onClick={() => tracksInputRef.current?.click()} className="press" style={{ display: 'flex', alignItems: 'center', gap: 6, background: theme.surface2, color: theme.text, border: 'none', borderRadius: 8, padding: '6px 10px', fontSize: 11.5, fontWeight: 700, cursor: 'pointer' }}>
            <Plus size={13} /> Add tracks
          </button>
        </div>

        {tracks.length === 0 ? (
          <div style={{ fontSize: 12, color: theme.muted, textAlign: 'center', padding: '18px 10px', background: theme.surface2, borderRadius: 10, marginBottom: 14 }}>No tracks added yet.</div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 14 }}>
            {tracks.map((t, i) => (
              <div key={t.id} style={{ display: 'flex', alignItems: 'center', gap: 8, background: theme.surface2, borderRadius: 10, padding: 8 }}>
                <span style={{ fontSize: 11, color: theme.muted, width: 14, flexShrink: 0 }}>{i + 1}</span>
                <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 5, minWidth: 0 }}>
                  <input style={trackInputStyle} value={t.title} onChange={e => updateTrack(t.id, 'title', e.target.value)} placeholder="Track title" />
                  <input style={trackInputStyle} value={t.artist} onChange={e => updateTrack(t.id, 'artist', e.target.value)} placeholder="Artist" />
                </div>
                <IconButton theme={theme} skin={skin} size="sm" label="Remove" onClick={() => removeTrack(t.id)}><X size={14} color={theme.muted} /></IconButton>
              </div>
            ))}
          </div>
        )}

        <div style={{ fontSize: 11, color: theme.muted, lineHeight: 1.6, marginBottom: 14 }}>Only upload music you own or have the rights to share.</div>

        <button onClick={handleSubmit} disabled={!canSubmit} className={canSubmit ? 'press' : undefined} style={{ width: '100%', background: canSubmit ? theme.accent : theme.surface2, color: canSubmit ? theme.bg : theme.muted, border: 'none', borderRadius: 10, padding: '12px 0', fontSize: 13, fontWeight: 700, cursor: canSubmit ? 'pointer' : 'default' }}>
          {submitting ? 'Sharing\u2026' : 'Share to Vinylist'}
        </button>

        <input ref={tracksInputRef} type="file" accept="audio/*" multiple style={{ display: 'none' }} onChange={handleTracksPick} />
        </div>
        <input ref={coverInputRef} type="file" accept="image/*" style={{ display: 'none' }} onChange={handleCoverPick} />
      </div>
    </div>
  );
}

/** Search Vinylist accounts by username/display name, with a Follow toggle
 *  per result. Reads/writes the `follows` table directly — it's a plain
 *  public-read, write-as-yourself table like likes/ratings, so no Edge
 *  Function is needed for this feature at all. */
function PeopleSearchSheet({ theme, skin, session, showToast, onClose }) {
  const [query, setQuery] = useState('');
  const [results, setResults] = useState([]);
  const [loading, setLoading] = useState(false);
  const [followingIds, setFollowingIds] = useState(() => new Set());
  const [busyId, setBusyId] = useState(null);
  const panelBg = skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : theme.surface;

  useEffect(() => {
    if (!supabaseClient || !session?.user) return;
    supabaseClient.from('follows').select('following_id').eq('follower_id', session.user.id)
      .then(({ data }) => setFollowingIds(new Set((data || []).map(r => r.following_id))));
  }, [session]);

  useEffect(() => {
    const q = query.trim();
    if (!supabaseClient || q.length < 2) { setResults([]); return; }
    let cancelled = false;
    setLoading(true);
    const t = setTimeout(async () => {
      const { data } = await supabaseClient.from('profiles')
        .select('id, username, display_name, bio, is_verified, role_label')
        .or(`username.ilike.%${q}%,display_name.ilike.%${q}%`)
        .limit(25);
      if (!cancelled) { setResults(data || []); setLoading(false); }
    }, 300); // small debounce so every keystroke doesn't fire a query
    return () => { cancelled = true; clearTimeout(t); };
  }, [query]);

  const toggleFollow = async (targetId) => {
    if (!session?.user) { showToast?.('Sign in from Settings \u2192 Account to follow people'); return; }
    if (targetId === session.user.id) { showToast?.("That's your own account"); return; }
    setBusyId(targetId);
    const isFollowing = followingIds.has(targetId);
    const { error } = isFollowing
      ? await supabaseClient.from('follows').delete().eq('follower_id', session.user.id).eq('following_id', targetId)
      : await supabaseClient.from('follows').insert({ follower_id: session.user.id, following_id: targetId });
    if (!error) {
      setFollowingIds(prev => { const next = new Set(prev); isFollowing ? next.delete(targetId) : next.add(targetId); return next; });
    } else {
      showToast?.("Couldn't update that follow");
    }
    setBusyId(null);
  };

  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 121, display: 'flex', alignItems: 'center', justifyContent: 'center', padding: 18, background: 'rgba(0,0,0,0.5)' }} onClick={onClose}>
      <div className={`fade-up ${skin === 'glass' ? 'glasspanel' : skin === 'neu' ? 'neupanel' : ''}`} onClick={e => e.stopPropagation()} style={{ width: '100%', maxWidth: 440, borderRadius: 20, padding: 20, maxHeight: '80vh', maxHeight: '80dvh', overflowY: 'auto', background: panelBg }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }}>Find people</div>
          <IconButton theme={theme} skin={skin} size="sm" label="Close" onClick={onClose}><X size={16} /></IconButton>
        </div>

        <div style={{ display: 'flex', alignItems: 'center', gap: 8, background: theme.surface2, borderRadius: 10, padding: '9px 12px', marginBottom: 14 }}>
          <Search size={15} color={theme.muted} />
          <input value={query} onChange={e => setQuery(e.target.value)} placeholder="Search by username or name" autoFocus
            style={{ flex: 1, background: 'none', border: 'none', outline: 'none', color: theme.text, fontSize: 13.5 }} />
        </div>

        {!supabaseClient ? (
          <div style={{ fontSize: 12, color: theme.muted, textAlign: 'center', padding: '20px 10px' }}>Backend isn't connected yet.</div>
        ) : query.trim().length < 2 ? (
          <div style={{ fontSize: 12, color: theme.muted, textAlign: 'center', padding: '20px 10px' }}>Type at least 2 characters to search.</div>
        ) : loading ? (
          <div style={{ fontSize: 12, color: theme.muted, textAlign: 'center', padding: '20px 10px' }}>Searching…</div>
        ) : results.length === 0 ? (
          <div style={{ fontSize: 12, color: theme.muted, textAlign: 'center', padding: '20px 10px' }}>No one found.</div>
        ) : (
          <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            {results.map(p => {
              const isFollowing = followingIds.has(p.id);
              const isSelf = session?.user?.id === p.id;
              return (
                <div key={p.id} className="rowhover" style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 6px', borderRadius: 10 }}>
                  <div style={{ width: 38, height: 38, borderRadius: '50%', flexShrink: 0, background: `linear-gradient(135deg, ${theme.accent2}, ${theme.accent})`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <User size={16} color={theme.bg} />
                  </div>
                  <div style={{ flex: 1, minWidth: 0 }}>
                    <div style={{ display: 'flex', alignItems: 'center', gap: 4, flexWrap: 'wrap' }}>
                      <span style={{ fontSize: 13, fontWeight: 700, overflow: 'hidden', textOverflow: 'ellipsis', whiteSpace: 'nowrap', maxWidth: '100%' }}>{p.display_name || p.username}</span>
                      {p.is_verified && <VerifiedBadge size={12} />}
                      {p.role_label && <RoleBadge label={p.role_label} theme={theme} skin={skin} />}
                    </div>
                    <div style={{ fontSize: 11.5, color: theme.muted, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>@{p.username}</div>
                  </div>
                  {!isSelf && (
                    <button onClick={() => toggleFollow(p.id)} disabled={busyId === p.id} className="press" style={{
                      display: 'flex', alignItems: 'center', gap: 5, fontSize: 11.5, fontWeight: 700, cursor: 'pointer',
                      border: isFollowing ? `1px solid ${theme.surface2}` : 'none',
                      background: isFollowing ? 'transparent' : theme.accent, color: isFollowing ? theme.muted : theme.bg,
                      borderRadius: 999, padding: '6px 12px',
                    }}>
                      {isFollowing ? <UserCheck size={13} /> : <UserPlus size={13} />} {isFollowing ? 'Following' : 'Follow'}
                    </button>
                  )}
                </div>
              );
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function PlaylistsHub({ theme, skin, playlists, setListFilter, deletePlaylist, newPlaylistName, setNewPlaylistName, createPlaylist }) {
  const panelClass = skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined;
  const panelBg = skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`;
  return (
    <div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <input value={newPlaylistName} onChange={e => setNewPlaylistName(e.target.value)} placeholder="New playlist name" style={{ flex: 1, background: `${theme.surface}dd`, border: `1px solid ${theme.surface2}`, borderRadius: 10, padding: '9px 10px', color: theme.text, fontSize: 12.5, outline: 'none' }} onKeyDown={e => e.key === 'Enter' && createPlaylist()} />
        <button onClick={createPlaylist} className="press" style={{ background: theme.surface2, color: theme.text, border: 'none', borderRadius: 10, padding: '0 14px', cursor: 'pointer', fontSize: 12.5, fontWeight: 700 }}>Create</button>
      </div>
      {playlists.length === 0 ? (
        <div style={{ color: theme.muted, fontSize: 13, textAlign: 'center', padding: '40px 10px' }}>No playlists yet — create one above.</div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {playlists.map(p => (
            <div key={p.id} className={panelClass} style={{ position: 'relative', display: 'flex', alignItems: 'center', gap: 12, background: panelBg, borderRadius: 14, padding: '13px 16px' }}>
              <button onClick={() => setListFilter('playlist:' + p.id)} className="rowhover" style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 12, background: 'none', border: 'none', textAlign: 'left', cursor: 'pointer', color: theme.text, padding: 0 }}>
                <div style={{ width: 40, height: 40, borderRadius: 10, flexShrink: 0, background: `linear-gradient(135deg, ${theme.accent2}, ${theme.accent})`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <ListMusic size={17} color={theme.bg} />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{p.name}</div>
                  <div style={{ fontSize: 11.5, color: theme.muted }}>{p.fingerprints.length} track{p.fingerprints.length !== 1 ? 's' : ''}</div>
                </div>
                <ChevronRight size={16} color={theme.muted} />
              </button>
              <button onClick={() => deletePlaylist(p.id)} title="Delete playlist" style={{ position: 'absolute', top: -6, right: -6, width: 18, height: 18, borderRadius: '50%', background: theme.surface2, border: 'none', color: theme.muted, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><X size={11} /></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const SongRow = React.memo(function SongRow({ s, theme, skin, currentIndex, isPlaying, playIndex, onRowDragStart, onRowDrop, setAddToPlaylistFor, toggleLike, removeSong, draggable, highlighted }) {
  return (
    <div
      data-song-idx={s._idx}
      draggable={draggable}
      onDragStart={() => draggable && onRowDragStart(s)}
      onDragOver={e => draggable && e.preventDefault()}
      onDrop={e => { if (!draggable) return; e.stopPropagation(); onRowDrop(s); }}
      className="rowhover"
      style={{
        display: 'flex', alignItems: 'center', gap: 10, padding: '8px 8px', borderRadius: 12,
        background: highlighted ? `${theme.accent}26` : (s._idx === currentIndex ? `${theme.surface}dd` : 'transparent'),
        boxShadow: highlighted ? `0 0 0 1.5px ${theme.accent}` : 'none',
        transition: 'background 350ms ease, box-shadow 350ms ease',
      }}
    >
      {draggable && <GripVertical size={15} color={theme.muted} style={{ cursor: 'grab', flexShrink: 0 }} />}
      <button
        onClick={(e) => { const rect = e.currentTarget.getBoundingClientRect(); playIndex(s._idx, rect, s.pictureUrl); }}
        style={{ width: 36, height: 36, borderRadius: 10, flexShrink: 0, border: 'none', cursor: 'pointer', overflow: 'hidden', background: s.pictureUrl ? `center/cover url(${s.pictureUrl})` : `linear-gradient(135deg, ${theme.accent2}, ${theme.accent})`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}
      >
        {!s.pictureUrl && (s._idx === currentIndex && isPlaying ? <Pause size={14} color={theme.bg} /> : <Play size={14} color={theme.bg} style={{ marginLeft: 1 }} />)}
      </button>
      <div onClick={(e) => { const rect = e.currentTarget.parentElement.querySelector('button').getBoundingClientRect(); playIndex(s._idx, rect, s.pictureUrl); }} style={{ flex: 1, minWidth: 0, cursor: 'pointer' }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', color: s._idx === currentIndex ? theme.accent : theme.text }}>{s.title}</div>
        <div style={{ fontSize: 11.5, color: theme.muted, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.artist}{s.playCount ? ` · ${s.playCount} plays` : ''}</div>
      </div>
      {s.lyrics && <Mic2 size={13} color={theme.muted} style={{ flexShrink: 0 }} />}
      <IconButton theme={theme} skin={skin} size="sm" label="Add to playlist" onClick={() => setAddToPlaylistFor(s._idx)}><ListPlus size={15} color={theme.muted} /></IconButton>
      <IconButton theme={theme} skin={skin} size="sm" label="Like" onClick={() => toggleLike(s._idx)}><Heart size={15} fill={s.liked ? theme.accent : 'none'} color={s.liked ? theme.accent : theme.muted} /></IconButton>
      <IconButton theme={theme} skin={skin} size="sm" label="Remove" onClick={() => removeSong(s._idx)}><Trash2 size={15} color={theme.muted} /></IconButton>
    </div>
  );
});

function AddToPlaylistSheet({ theme, skin, song, playlists, onToggle, onClose, newPlaylistName, setNewPlaylistName, createPlaylist }) {
  if (!song) return null;
  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 40, display: 'flex', alignItems: 'flex-end', background: 'rgba(0,0,0,0.5)' }} onClick={onClose}>
      <div className={`fade-up ${skin === 'glass' ? 'glasspanel' : skin === 'neu' ? 'neupanel' : ''}`} onClick={e => e.stopPropagation()} style={{ width: '100%', borderRadius: '20px 20px 0 0', padding: 20, maxHeight: '70vh', overflowY: 'auto', background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : theme.surface }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }}>Add "{song.title}" to…</div>
          <IconButton theme={theme} skin={skin} size="sm" label="Close" onClick={onClose}><X size={16} /></IconButton>
        </div>
        {playlists.length === 0 && <div style={{ fontSize: 12.5, color: theme.muted, marginBottom: 14 }}>No playlists yet — create one below.</div>}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 4, marginBottom: 14 }}>
          {playlists.map(p => {
            const has = p.fingerprints.includes(song.fingerprint);
            return (
              <button key={p.id} onClick={() => onToggle({ playlistId: p.id, fingerprint: song.fingerprint })} className="rowhover press" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: 'none', border: 'none', borderRadius: 10, padding: '10px 8px', cursor: 'pointer', color: theme.text }}>
                <span style={{ fontSize: 13.5 }}>{p.name}</span>
                <div style={{ width: 20, height: 20, borderRadius: 5, border: `1.5px solid ${has ? theme.accent : theme.muted}`, background: has ? theme.accent : 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{has && <Check size={13} color={theme.bg} />}</div>
              </button>
            );
          })}
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <input value={newPlaylistName} onChange={e => setNewPlaylistName(e.target.value)} placeholder="New playlist name" style={{ flex: 1, background: theme.surface2, border: 'none', borderRadius: 10, padding: '9px 10px', color: theme.text, fontSize: 12.5, outline: 'none' }} onKeyDown={e => e.key === 'Enter' && createPlaylist(song.fingerprint)} />
          <button onClick={() => createPlaylist(song.fingerprint)} className={skin === 'neu' ? 'neu-press' : 'press'} style={{ borderRadius: 10, padding: '0 14px', cursor: 'pointer', fontSize: 12.5, fontWeight: 700, ...segStyle(theme, skin, true) }}>Create &amp; add</button>
        </div>
      </div>
    </div>
  );
}

// Bottom sheet: user confirms/corrects title + artist, search runs in the
// background against a free lyrics API, and results are previewed here
// before the user chooses to bring them into the editable lyrics draft.
function LyricsSearchSheet({ theme, skin, form, setForm, status, result, allResults, sourceIdx, onSelectSource, onSearch, onUse, onClose }) {
  const inputStyle = { width: '100%', background: theme.surface2, border: 'none', borderRadius: 10, padding: '10px 11px', color: theme.text, fontSize: 13, outline: 'none', marginBottom: 8 };
  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 40, display: 'flex', alignItems: 'flex-end', background: 'rgba(0,0,0,0.5)' }} onClick={onClose}>
      <div className={`fade-up ${skin === 'glass' ? 'glasspanel' : skin === 'neu' ? 'neupanel' : ''}`} onClick={e => e.stopPropagation()} style={{ width: '100%', borderRadius: '20px 20px 0 0', padding: 20, maxHeight: '80vh', overflowY: 'auto', background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : theme.surface }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }}>Search lyrics online</div>
          <IconButton theme={theme} skin={skin} size="sm" label="Close" onClick={onClose}><X size={16} /></IconButton>
        </div>

        <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 10 }}>Song title</div>
        <input style={inputStyle} value={form.title} onChange={e => setForm(f => ({ ...f, title: e.target.value }))} placeholder="Song title" />
        <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 10 }}>Artist</div>
        <input style={inputStyle} value={form.artist} onChange={e => setForm(f => ({ ...f, artist: e.target.value }))} placeholder="Artist" onKeyDown={e => e.key === 'Enter' && onSearch()} />

        <button
          onClick={onSearch}
          disabled={status === 'searching' || !form.title.trim() || !form.artist.trim()}
          className={skin === 'neu' ? 'neu-press' : 'press'}
          style={{ marginTop: 4, width: '100%', borderRadius: 10, padding: '11px 0', cursor: 'pointer', fontSize: 13, fontWeight: 700, opacity: status === 'searching' ? 0.6 : 1, ...segStyle(theme, skin, true) }}
        >
          {status === 'searching' ? 'Searching\u2026' : 'Search'}
        </button>

        {status === 'not-found' && (
          <div style={{ fontSize: 12.5, color: theme.muted, marginTop: 14, textAlign: 'center' }}>Checked multiple sources but couldn't find lyrics for that title/artist. Try adjusting the spelling, or removing anything like "(Official Video)".</div>
        )}
        {status === 'error' && (
          <div style={{ fontSize: 12.5, color: theme.muted, marginTop: 14, textAlign: 'center' }}>Couldn't search right now. Check your connection and try again.</div>
        )}

        {status === 'found' && (
          <div style={{ marginTop: 16 }}>
            <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 8 }}>
              {allResults.length > 1
                ? `Found lyrics from ${allResults.length} sources \u2014 not happy with this one? Pick another below:`
                : 'Found lyrics \u2014 review before saving:'}
            </div>
            {allResults.length > 1 && (
              <select
                value={sourceIdx}
                onChange={e => onSelectSource(Number(e.target.value))}
                style={{ width: '100%', background: theme.surface2, border: 'none', borderRadius: 10, padding: '10px 11px', color: theme.text, fontSize: 13, outline: 'none', marginBottom: 10, appearance: 'auto' }}
              >
                {allResults.map((r, i) => (
                  <option key={r.name} value={i}>{r.name}{r.text.includes('[') && /\[\d{2}:\d{2}/.test(r.text) ? ' \u00b7 synced' : ' \u00b7 plain'}</option>
                ))}
              </select>
            )}
            <div className={skin === 'neu' ? 'neupanel-inset' : undefined} style={{ maxHeight: 220, overflowY: 'auto', background: skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface2}`, borderRadius: 12, padding: 12, fontSize: 12.5, lineHeight: 1.6, whiteSpace: 'pre-wrap', color: theme.text, marginBottom: 12 }}>
              {result}
            </div>
            <button onClick={onUse} className={skin === 'neu' ? 'neu-press' : 'press'} style={{ width: '100%', borderRadius: 10, padding: '11px 0', cursor: 'pointer', fontSize: 13, fontWeight: 700, background: theme.accent, color: theme.bg, border: 'none' }}>
              Use these lyrics
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

/* ==========================================================================
   SECTION 9 — LYRICS VIEW
   ========================================================================== */

function LyricsView({ theme, currentSong, editingLyrics, setEditingLyrics, lyricsDraft, setLyricsDraft, saveLyrics, saveLyricsToPhone, activeLyricIndex, lyricsScrollRef, activeLyricRef, seek, reducedMotion, skin, tapSync, startTapSync, tapSyncNext, cancelTapSync, openLyricsSearch }) {
  const neu = skin === 'neu';
  // Small pill button matching the raised/lifted neu buttons used elsewhere
  // (IconButton), but with a text label — reused for every button on this
  // screen so Lyrics gets the same "lifted button" treatment as Now Playing
  // and Settings when the Neumorphism skin is active.
  const LyricsBtn = ({ onClick, children, primary }) => (
    <button
      onClick={onClick}
      className={neu ? 'neu-press' : 'press'}
      style={{
        background: neu ? 'var(--neu-bg)' : (primary ? theme.accent : theme.surface),
        color: neu ? theme.text : (primary ? theme.bg : theme.text),
        border: 'none', borderRadius: 999, padding: '9px 20px', fontWeight: primary ? 700 : 600, fontSize: 13,
        cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6,
        boxShadow: neu ? `5px 5px 10px var(--neu-dark), -5px -5px 10px var(--neu-light)${primary ? `, 0 0 0 1px ${theme.accent}45` : ''}` : undefined,
      }}
    >{children}</button>
  );

  if (!currentSong) return <div style={{ color: theme.muted, fontSize: 13, textAlign: 'center', marginTop: 60 }}>Play a song to view its lyrics here.</div>;
  const ly = currentSong.lyrics;

  if (tapSync) {
    const progress = tapSync.idx / tapSync.lines.length;
    return (
      <div className="fade-up" style={{ marginTop: 12, display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center' }}>
        <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 6 }}>Tap in time with the vocals — line {tapSync.idx + 1} of {tapSync.lines.length}</div>
        <div className={neu ? 'neupanel-inset' : undefined} style={{ width: '100%', height: 4, borderRadius: 999, background: neu ? 'var(--neu-bg)' : theme.surface, overflow: 'hidden', marginBottom: 22 }}>
          <div style={{ width: `${progress * 100}%`, height: '100%', background: theme.accent, transition: 'width 200ms ease' }} />
        </div>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 22, fontWeight: 600, lineHeight: 1.4, minHeight: 90, display: 'flex', alignItems: 'center', padding: '0 8px' }}>
          {tapSync.lines[tapSync.idx]}
        </div>
        {tapSync.idx + 1 < tapSync.lines.length && (
          <div style={{ fontSize: 12.5, color: theme.muted, marginTop: 8, fontStyle: 'italic' }}>Next: {tapSync.lines[tapSync.idx + 1]}</div>
        )}
        <button onClick={tapSyncNext} className={neu ? 'neu-press' : 'press'} style={{
          marginTop: 30, width: 120, height: 120, borderRadius: '50%', border: 'none', fontWeight: 800, fontSize: 15, cursor: 'pointer',
          display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 6,
          background: neu ? 'var(--neu-bg)' : theme.accent, color: neu ? theme.accent : theme.bg,
          boxShadow: neu ? `8px 8px 16px var(--neu-dark), -8px -8px 16px var(--neu-light), 0 0 0 1px ${theme.accent}45, 0 0 16px ${theme.accent}70` : '0 12px 30px -10px rgba(0,0,0,0.5)',
        }}>
          <Hand size={26} /> TAP
        </button>
        <button onClick={cancelTapSync} style={{ marginTop: 22, background: 'none', border: 'none', color: theme.muted, fontSize: 12.5, cursor: 'pointer' }}>Cancel sync</button>
      </div>
    );
  }

  if (editingLyrics || !ly) {
    return (
      <div className="fade-up" style={{ marginTop: 12 }}>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 18, fontWeight: 600, marginBottom: 4 }}>{currentSong.title}</div>
        <div style={{ fontSize: 12.5, color: theme.muted, marginBottom: 16 }}>{currentSong.artist}</div>
        <div style={{ fontSize: 12.5, color: theme.muted, marginBottom: 8, lineHeight: 1.5 }}>Paste plain lyrics, or use LRC-style timestamps like <code style={{ background: theme.surface, padding: '1px 5px', borderRadius: 4 }}>[00:12.50]</code> for a synced, karaoke-style view. No timestamps? Play the song and use <b>Tap to sync</b> below to generate them by ear.</div>
        <textarea
          value={lyricsDraft} onChange={e => setLyricsDraft(e.target.value)}
          placeholder={'[00:00.00] First line of the song\n[00:04.30] Second line...'}
          className={neu ? 'neupanel-inset' : undefined}
          style={{
            width: '100%', minHeight: 260, color: theme.text, borderRadius: 14, padding: 14, fontSize: 13.5, lineHeight: 1.7,
            resize: 'vertical', outline: 'none', fontFamily: 'inherit',
            background: neu ? 'var(--neu-bg)' : `${theme.surface}dd`,
            border: neu ? 'none' : `1px solid ${theme.surface2}`,
          }}
        />
        <div style={{ display: 'flex', gap: 8, marginTop: 12, flexWrap: 'wrap' }}>
          <LyricsBtn onClick={saveLyrics} primary>Save lyrics</LyricsBtn>
          <LyricsBtn onClick={openLyricsSearch}><Search size={14} /> Search online</LyricsBtn>
          <LyricsBtn onClick={startTapSync}><Hand size={14} /> Tap to sync</LyricsBtn>
          {ly && <LyricsBtn onClick={() => setEditingLyrics(false)}>Cancel</LyricsBtn>}
        </div>
      </div>
    );
  }

  return (
    <div className="fade-up" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
      <div style={{ position: 'relative', width: '100%', maxWidth: 380 }}>
        <div style={{ textAlign: 'center', marginTop: 8, marginBottom: 4 }}>
          <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 600 }}>{currentSong.title}</div>
          <div style={{ fontSize: 12, color: theme.muted, marginTop: 2 }}>{currentSong.artist}{ly.synced ? ' · synced' : ''}</div>
        </div>
        <button
          onClick={saveLyricsToPhone}
          title="Save a copy to phone storage (Downloads/Music Lyrics)"
          aria-label="Save a copy of these lyrics to phone storage"
          className={skin === 'neu' ? 'neu-press' : 'press'}
          style={{
            position: 'absolute', top: 6, right: 6, width: 34, height: 34, borderRadius: '50%',
            border: 'none', cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
            background: skin === 'neu' ? 'var(--neu-bg)' : theme.surface, color: theme.accent,
            boxShadow: skin === 'neu' ? `4px 4px 8px var(--neu-dark), -4px -4px 8px var(--neu-light)` : undefined,
          }}
        ><Download size={16} /></button>
      </div>
      <button onClick={() => setEditingLyrics(true)} style={{ background: 'none', border: 'none', color: theme.accent, fontSize: 11.5, cursor: 'pointer', marginBottom: 10 }}>Edit lyrics</button>
      {/* Neumorphism: the lyrics themselves sit inside a sunken "hole" pressed
          into the surface, like a little window onto the page behind it —
          matching how the lyrics scroller reads as a hollow in the reference
          design, instead of floating directly on the app background. */}
      <div className={neu ? 'neupanel-inset' : undefined} style={{ width: '100%', maxWidth: 380, borderRadius: neu ? 22 : 0, background: neu ? 'var(--neu-bg)' : 'transparent' }}>
        <div ref={lyricsScrollRef} style={{ width: '100%', textAlign: 'center', padding: '30vh 6px 30vh', maxHeight: neu ? '60vh' : undefined, overflowY: neu ? 'auto' : undefined }}>
          {ly.lines.map((line, i) => {
            const text = ly.synced ? line.text : line;
            const active = i === activeLyricIndex, isPast = i < activeLyricIndex;
            return (
              <div key={i} ref={active ? activeLyricRef : null} onClick={() => ly.synced && seek(line.time)} style={{ fontFamily: "'Fraunces', serif", fontSize: active ? 21 : 16.5, fontWeight: active ? 600 : 400, fontStyle: active ? 'normal' : 'italic', color: active ? theme.accent : isPast ? theme.muted : theme.text, opacity: active ? 1 : isPast ? 0.45 : 0.65, padding: '9px 4px', cursor: ly.synced ? 'pointer' : 'default', transition: reducedMotion ? 'none' : 'all 260ms ease', lineHeight: 1.5 }}>
                {text || '\u00A0'}
              </div>
            );
          })}
        </div>
      </div>
    </div>
  );
}

/* ==========================================================================
   SECTION 9.5 — WEEKLY REPORT VIEW
   ========================================================================== */

function formatHM(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.round((totalSeconds % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function RatingBadge({ theme, rating }) {
  if (!rating) return null;
  const Icon = rating === 'up' ? ThumbsUp : ThumbsDown;
  return <Icon size={13} color={theme.accent} fill={theme.accent} style={{ flexShrink: 0 }} />;
}

function ReportView({ theme, skin, lastReport, songs, weekStart }) {
  const daysIn = Math.floor((Date.now() - weekStart) / (24 * 60 * 60 * 1000));
  const daysLeft = Math.max(0, 7 - daysIn);

  const liveTop = useMemo(() => {
    return [...songs].filter(s => (s.weekPlays || 0) > 0 || (s.weekSeconds || 0) > 0)
      .sort((a, b) => (b.weekPlays || 0) - (a.weekPlays || 0) || (b.weekSeconds || 0) - (a.weekSeconds || 0))
      .slice(0, 10);
  }, [songs]);
  const liveTotalPlays = useMemo(() => songs.reduce((sum, s) => sum + (s.weekPlays || 0), 0), [songs]);
  const liveTotalSeconds = useMemo(() => songs.reduce((sum, s) => sum + (s.weekSeconds || 0), 0), [songs]);

  const report = lastReport;

  return (
    <div className="fade-up" style={{ paddingTop: 8, paddingBottom: 10 }}>
      <SectionLabel theme={theme} icon={BarChart3} text="This week so far" />
      <div style={{ display: 'flex', gap: 8, marginBottom: 18 }}>
        <div className={skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined} style={{ flex: 1, background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`, borderRadius: 14, padding: '14px 12px', textAlign: 'center' }}>
          <div style={{ fontSize: 22, fontWeight: 800, color: theme.accent }}>{liveTotalPlays}</div>
          <div style={{ fontSize: 11, color: theme.muted, marginTop: 2 }}>total plays</div>
        </div>
        <div className={skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined} style={{ flex: 1, background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`, borderRadius: 14, padding: '14px 12px', textAlign: 'center' }}>
          <div style={{ fontSize: 22, fontWeight: 800, color: theme.accent }}>{formatHM(liveTotalSeconds)}</div>
          <div style={{ fontSize: 11, color: theme.muted, marginTop: 2 }}>time listened</div>
        </div>
        <div className={skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined} style={{ flex: 1, background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`, borderRadius: 14, padding: '14px 12px', textAlign: 'center' }}>
          <div style={{ fontSize: 22, fontWeight: 800, color: theme.accent }}>{daysLeft}</div>
          <div style={{ fontSize: 11, color: theme.muted, marginTop: 2 }}>day{daysLeft !== 1 ? 's' : ''} to full report</div>
        </div>
      </div>

      {liveTop.length === 0 ? (
        <div style={{ color: theme.muted, fontSize: 13, textAlign: 'center', padding: '20px 10px' }}>Nothing played yet this week — your top tracks will show up here.</div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 2, marginBottom: 22 }}>
          {liveTop.map((s, i) => (
            <div key={s.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 10px', borderRadius: 12 }}>
              <span style={{ fontSize: 12, color: theme.muted, width: 16, flexShrink: 0 }}>{i + 1}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.title}</div>
                <div style={{ fontSize: 11, color: theme.muted, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.artist} · {s.weekPlays || 0} play{(s.weekPlays || 0) !== 1 ? 's' : ''} · {formatHM(s.weekSeconds || 0)}</div>
              </div>
              <RatingBadge theme={theme} rating={s.rating} />
            </div>
          ))}
        </div>
      )}

      {report && (
        <>
          <SectionLabel theme={theme} icon={Clock} text="Last full report" />
          <div style={{ fontSize: 11.5, color: theme.muted, marginTop: -6, marginBottom: 10 }}>
            {new Date(report.periodStart).toLocaleDateString()} – {new Date(report.periodEnd).toLocaleDateString()}
          </div>
          <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
            <div className={skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined} style={{ flex: 1, background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`, borderRadius: 14, padding: '12px', textAlign: 'center' }}>
              <div style={{ fontSize: 18, fontWeight: 800 }}>{report.totalPlays}</div>
              <div style={{ fontSize: 10.5, color: theme.muted }}>plays</div>
            </div>
            <div className={skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined} style={{ flex: 1, background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`, borderRadius: 14, padding: '12px', textAlign: 'center' }}>
              <div style={{ fontSize: 18, fontWeight: 800 }}>{formatHM(report.totalSeconds)}</div>
              <div style={{ fontSize: 10.5, color: theme.muted }}>listened</div>
            </div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            {report.songs.map((s, i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 10px', borderRadius: 12 }}>
                <span style={{ fontSize: 12, color: theme.muted, width: 16, flexShrink: 0 }}>{i + 1}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.title}</div>
                  <div style={{ fontSize: 11, color: theme.muted, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.artist} · {s.plays} play{s.plays !== 1 ? 's' : ''} · {formatHM(s.seconds)}</div>
                </div>
                <RatingBadge theme={theme} rating={s.rating} />
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

      <div style={{ height: 8 }} />
      <SectionLabel theme={theme} icon={HelpCircle} text="Help & legal" />
      <FooterRow theme={theme} skin={skin} icon={HelpCircle} label="How to use Vinylist" onClick={() => openInfo('howto')} />
      <FooterRow theme={theme} skin={skin} icon={MessageCircle} label="Contact us" onClick={() => openInfo('contact')} />
      <FooterRow theme={theme} skin={skin} icon={FileText} label="Terms & Conditions" onClick={() => openInfo('terms')} />
      <FooterRow theme={theme} skin={skin} icon={ShieldCheck} label="Privacy Policy" onClick={() => openInfo('privacy')} last />

      <div style={{ fontSize: 11, color: theme.muted, textAlign: 'center', marginTop: 22, lineHeight: 1.8 }}>
        {songCount} track{songCount !== 1 ? 's' : ''} indexed this session<br />
        Space = play/pause · ← → = seek · ↑ ↓ = volume · M = mute · S = shuffle
      </div>
      <div style={{ fontSize: 11, color: theme.muted, textAlign: 'center', marginTop: 18, opacity: 0.6, letterSpacing: 0.5 }}>
        Vinylist by Francis&M_Tech
      </div>
    </div>
  );
}

function FooterRow({ theme, skin, icon: Icon, label, onClick, last }) {
  return (
    <button
      onClick={onClick}
      className={`press ${skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : ''}`}
      style={{
        display: 'flex', alignItems: 'center', gap: 12, width: '100%', textAlign: 'left',
        background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`, border: 'none', cursor: 'pointer',
        borderRadius: 14, padding: '13px 16px', marginBottom: last ? 0 : 8, color: theme.text, font: 'inherit',
      }}
    >
      <Icon size={16} color={theme.accent} style={{ flexShrink: 0 }} />
      <span style={{ flex: 1, fontSize: 13, fontWeight: 600 }}>{label}</span>
      <ChevronRight size={16} color={theme.muted} />
    </button>
  );
}
