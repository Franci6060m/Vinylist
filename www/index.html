      const ctx = new Ctx();
      const filters = EQ_BANDS.map((freq, i) => {
        const f = ctx.createBiquadFilter(); f.type = 'peaking'; f.frequency.value = freq; f.Q.value = 1.1; f.gain.value = eq[i] || 0;
        return f;
      });
      for (let i = 0; i < filters.length - 1; i++) filters[i].connect(filters[i + 1]);

      const srcA = ctx.createMediaElementSource(audioARef.current);
      const srcB = ctx.createMediaElementSource(audioBRef.current);
      const gA = ctx.createGain(), gB = ctx.createGain();
      gA.gain.value = 1; gB.gain.value = 0;
      srcA.connect(gA).connect(filters[0]);
      srcB.connect(gB).connect(filters[0]);

      const analyser = ctx.createAnalyser(); analyser.fftSize = 128; analyser.smoothingTimeConstant = 0.75;
      const preamp = ctx.createGain(); preamp.gain.value = Math.pow(10, preampDb / 20);
      const shaper = ctx.createWaveShaper(); shaper.curve = makeSoftClipCurve(0.5); shaper.oversample = '2x';
      const master = ctx.createGain(); master.gain.value = muted ? 0 : volume;
      const splitter = ctx.createChannelSplitter(2);
      const analyserL = ctx.createAnalyser(); analyserL.fftSize = 64;
      const analyserR = ctx.createAnalyser(); analyserR.fftSize = 64;

      filters[filters.length - 1].connect(analyser).connect(preamp).connect(shaper).connect(master).connect(ctx.destination);
      master.connect(splitter);
      splitter.connect(analyserL, 0); splitter.connect(analyserR, 1);

      audioARef.current.volume = 1; audioBRef.current.volume = 1;
      audioCtxRef.current = ctx; gainARef.current = gA; gainBRef.current = gB;
      filtersRef.current = filters; analyserRef.current = analyser;
      preampRef.current = preamp; shaperRef.current = shaper; masterGainRef.current = master;
      analyserLRef.current = analyserL; analyserRRef.current = analyserR;
      dataArrayRef.current = new Uint8Array(analyser.frequencyBinCount);
      dataLRef.current = new Uint8Array(analyserL.frequencyBinCount);
      dataRRef.current = new Uint8Array(analyserR.frequencyBinCount);
    } catch { /* Web Audio unavailable — plain <audio> playback still works */ }
  }, [eq, muted, volume, preampDb]);

  const getLevels = useCallback(() => {
    if (analyserRef.current && dataArrayRef.current) { analyserRef.current.getByteFrequencyData(dataArrayRef.current); return dataArrayRef.current; }
    return null;
  }, []);
  const getLevelL = useCallback(() => {
    if (!analyserLRef.current) return 0;
    analyserLRef.current.getByteTimeDomainData(dataLRef.current);
    let sum = 0; for (let i = 0; i < dataLRef.current.length; i++) sum += Math.abs(dataLRef.current[i] - 128);
    return sum / dataLRef.current.length / 60;
  }, []);
  const getLevelR = useCallback(() => {
    if (!analyserRRef.current) return 0;
    analyserRRef.current.getByteTimeDomainData(dataRRef.current);
    let sum = 0; for (let i = 0; i < dataRRef.current.length; i++) sum += Math.abs(dataRRef.current[i] - 128);
    return sum / dataRRef.current.length / 60;
  }, []);

  // NOTE: the audio-level polling loop that used to live here (driving a
  // top-level `level` state at animation-frame rate) has been moved down
  // into DiscGlow, the one small component that actually renders it. Doing
  // it here forced this whole App tree — including the Library list — to
  // re-render 60x/sec any time a song had ever started playing, which is
  // what caused the Library tab lag. See DiscGlow, near PlayerView.
  useEffect(() => { if (masterGainRef.current) masterGainRef.current.gain.value = muted ? 0 : volume; }, [volume, muted]);
  useEffect(() => { filtersRef.current.forEach((f, i) => { if (f) f.gain.value = eq[i] || 0; }); }, [eq]);
  useEffect(() => { if (preampRef.current) preampRef.current.gain.value = Math.pow(10, preampDb / 20); }, [preampDb]);
  useEffect(() => { [audioARef.current, audioBRef.current].forEach(a => { if (a) a.playbackRate = speed; }); }, [speed]);

  /* ---------------------- transport / gapless / crossfade ---------------------- */

  /* ---------------------- derived lists ---------------------- */
  const filteredSongs = useMemo(
    () => buildFilteredList(songs, listFilter, search, playlists),
    [songs, listFilter, playlists, search]
  );
  // The ordered list next/prev walk through — recomputed live from
  // queueContext so it stays correct even if the playlist/library changes
  // while a track from it is playing.
  const activeQueueSongs = useMemo(
    () => buildFilteredList(songs, queueContext.filter, queueContext.search, playlists),
    [songs, queueContext, playlists]
  );

  const getAdjacentIndex = useCallback((dir, fromIndex) => {
    const base = fromIndex ?? currentIndex;
    if (songs.length === 0) return -1;
    // Prefer walking the queue the current track was played from (e.g. a
    // playlist, in that playlist's own order). If the track has fallen out
    // of that context (removed, playlist deleted, etc.) fall back to the
    // full library so playback never just stops dead.
    const queue = activeQueueSongs.length > 0 ? activeQueueSongs : songs.map((s, i) => ({ ...s, _idx: i }));
    const pos = queue.findIndex(s => s._idx === base);
    if (pos === -1) {
      if (shuffle) {
        if (songs.length === 1) return 0;
        let idx; do { idx = Math.floor(Math.random() * songs.length); } while (idx === base);
        return idx;
      }
      let idx = base + dir;
      if (idx < 0) idx = songs.length - 1;
      if (idx >= songs.length) idx = 0;
      return idx;
    }
    if (shuffle) {
      if (queue.length === 1) return queue[0]._idx;
      let randPos; do { randPos = Math.floor(Math.random() * queue.length); } while (randPos === pos);
      return queue[randPos]._idx;
    }
    let newPos = pos + dir;
    if (newPos < 0) newPos = queue.length - 1;
    if (newPos >= queue.length) newPos = 0;
    return queue[newPos]._idx;
  }, [songs, shuffle, currentIndex, activeQueueSongs]);

  const playIndex = useCallback((idx, autoplay = true) => {
    if (idx < 0 || idx >= songs.length) return;
    ensureGraph();
    const slotRef = activeAudioRef.current ? activeAudioRef : audioARef;
    setCurrentIndex(idx);
    if (autoplay) setSongs(prev => prev.map((s, i) => i === idx ? { ...s, lastPlayedAt: Date.now() } : s));
    preloadedIndexRef.current = null;
    crossfadingRef.current = false;
    const ctx = audioCtxRef.current;
    const gA = gainARef.current, gB = gainBRef.current;
    if (ctx && gA && gB) { const now = ctx.currentTime; gA.gain.cancelScheduledValues(now); gB.gain.cancelScheduledValues(now); gA.gain.setValueAtTime(activeSlot === 'A' ? 1 : 0, now); gB.gain.setValueAtTime(activeSlot === 'B' ? 1 : 0, now); }
    requestAnimationFrame(() => {
      const el = slotRef.current; if (!el) return;
      el.src = songs[idx].url; el.currentTime = 0;
      if (autoplay) { if (ctx && ctx.state === 'suspended') ctx.resume(); el.play().catch(() => {}); }
    });
  }, [songs, ensureGraph, activeSlot, activeAudioRef]);

  const togglePlay = useCallback(() => {
    if (!currentSong) { if (songs.length > 0) playIndex(0); return; }
    ensureGraph();
    if (audioCtxRef.current?.state === 'suspended') audioCtxRef.current.resume();
    const el = activeAudioRef.current;
    if (isPlaying) el.pause(); else el.play().catch(() => {});
  }, [currentSong, isPlaying, ensureGraph, songs.length, playIndex, activeAudioRef]);

  const finalizeSwap = useCallback((nextIdx) => {
    const newActive = activeSlot === 'A' ? 'B' : 'A';
    setActiveSlot(newActive);
    setCurrentIndex(nextIdx);
    preloadedIndexRef.current = null;
    crossfadingRef.current = false;
    const old = activeAudioRef.current;
    setTimeout(() => { if (old) old.pause(); }, 40);
  }, [activeSlot, activeAudioRef]);

  const doGaplessSwap = useCallback(() => {
    const nextIdx = preloadedIndexRef.current; if (nextIdx == null) return;
    const ctx = audioCtxRef.current, gA = gainARef.current, gB = gainBRef.current;
    if (ctx && gA && gB) { const now = ctx.currentTime; gA.gain.setValueAtTime(activeSlot === 'A' ? 0 : 1, now); gB.gain.setValueAtTime(activeSlot === 'B' ? 0 : 1, now); }
    inactiveAudioRef.current.play().catch(() => {});
    finalizeSwap(nextIdx);
  }, [activeSlot, inactiveAudioRef, finalizeSwap]);

  const startCrossfade = useCallback(() => {
    const nextIdx = preloadedIndexRef.current; if (nextIdx == null || crossfadingRef.current) return;
    crossfadingRef.current = true;
    const ctx = audioCtxRef.current, gA = gainARef.current, gB = gainBRef.current;
    inactiveAudioRef.current.play().catch(() => {});
    if (ctx && gA && gB) {
      const now = ctx.currentTime, dur = crossfadeSeconds;
      const [outG, inG] = activeSlot === 'A' ? [gA, gB] : [gB, gA];
      outG.gain.cancelScheduledValues(now); inG.gain.cancelScheduledValues(now);
      outG.gain.setValueAtTime(outG.gain.value, now); inG.gain.setValueAtTime(inG.gain.value, now);
      outG.gain.linearRampToValueAtTime(0, now + dur); inG.gain.linearRampToValueAtTime(1, now + dur);
    }
    setTimeout(() => finalizeSwap(nextIdx), crossfadeSeconds * 1000);
  }, [activeSlot, crossfadeSeconds, inactiveAudioRef, finalizeSwap]);

  const playNext = useCallback(() => {
    if (crossfadingRef.current) return;
    const idx = getAdjacentIndex(1); if (idx >= 0) playIndex(idx);
  }, [getAdjacentIndex, playIndex]);

  const playPrev = useCallback(() => {
    if (currentTime > 3 && activeAudioRef.current) { activeAudioRef.current.currentTime = 0; return; }
    const idx = getAdjacentIndex(-1); if (idx >= 0) playIndex(idx);
  }, [getAdjacentIndex, playIndex, currentTime, activeAudioRef]);

  const bumpPlayCount = useCallback((idx) => {
    setSongs(prev => prev.map((s, i) => i === idx ? { ...s, playCount: (s.playCount || 0) + 1, weekPlays: (s.weekPlays || 0) + 1 } : s));
  }, []);

  const handleTimeUpdate = useCallback((e) => {
    if (e.currentTarget !== activeAudioRef.current) return;
    const t = e.currentTarget.currentTime; setCurrentTime(t);
    const fp = songs[currentIndex]?.fingerprint;
    if (fp) {
      const last = lastTickRef.current;
      // Only count forward, contiguous progress as "listened" — a gap of 2s+
      // means a seek or loop restart, not continuous listening.
      if (last.fp === fp && t > last.t && t - last.t < 2) {
        listenAccumRef.current[fp] = (listenAccumRef.current[fp] || 0) + (t - last.t);
      }
      lastTickRef.current = { fp, t };
    }
    const dur = e.currentTarget.duration || 0;
    if (!dur || repeatMode === 'one' || songs.length < 2) return;
    if (preloadedIndexRef.current == null && dur - t <= 10) {
      const nextIdx = getAdjacentIndex(1);
      if (nextIdx >= 0 && !(repeatMode === 'off' && !shuffle && currentIndex === songs.length - 1)) {
        preloadedIndexRef.current = nextIdx;
        const el = inactiveAudioRef.current; el.src = songs[nextIdx].url; el.load();
      }
    }
    if (crossfadeSeconds > 0 && preloadedIndexRef.current != null && !crossfadingRef.current && dur - t <= crossfadeSeconds) startCrossfade();
  }, [activeAudioRef, repeatMode, songs, getAdjacentIndex, currentIndex, shuffle, inactiveAudioRef, crossfadeSeconds, startCrossfade]);

  const handleEnded = useCallback((e) => {
    if (e.currentTarget !== activeAudioRef.current) return;
    bumpPlayCount(currentIndex);
    if (repeatMode === 'one') { e.currentTarget.currentTime = 0; e.currentTarget.play().catch(() => {}); return; }
    if (crossfadeSeconds === 0 && preloadedIndexRef.current != null) { doGaplessSwap(); return; }
    if (repeatMode === 'off' && !shuffle && currentIndex === songs.length - 1) { setIsPlaying(false); return; }
    playNext();
  }, [activeAudioRef, repeatMode, crossfadeSeconds, doGaplessSwap, shuffle, currentIndex, songs.length, playNext, bumpPlayCount]);

  const seek = useCallback((t) => { if (activeAudioRef.current) activeAudioRef.current.currentTime = t; setCurrentTime(t); }, [activeAudioRef]);
  const cycleRepeat = () => setRepeatMode(m => m === 'off' ? 'all' : m === 'all' ? 'one' : 'off');

  /* ---------------------- background playback / lock-screen controls ---------------------- */
  useEffect(() => {
    if (!('mediaSession' in navigator)) return;
    if (!backgroundPlaybackEnabled || !currentSong) { navigator.mediaSession.metadata = null; return; }
    navigator.mediaSession.metadata = new MediaMetadata({
      title: currentSong.title, artist: currentSong.artist, album: currentSong.album || '',
      artwork: currentSong.pictureUrl ? [{ src: currentSong.pictureUrl, sizes: '512x512', type: 'image/png' }] : [],
    });
    navigator.mediaSession.playbackState = isPlaying ? 'playing' : 'paused';
  }, [backgroundPlaybackEnabled, currentSong, isPlaying]);

  useEffect(() => {
    if (!('mediaSession' in navigator) || !backgroundPlaybackEnabled) return;
    const handlers = [
      ['play', () => togglePlay()], ['pause', () => togglePlay()],
      ['previoustrack', () => playPrev()], ['nexttrack', () => playNext()],
      ['seekto', (details) => { if (details.seekTime != null) seek(details.seekTime); }],
    ];
    handlers.forEach(([action, handler]) => { try { navigator.mediaSession.setActionHandler(action, handler); } catch { /* action unsupported */ } });
    return () => handlers.forEach(([action]) => { try { navigator.mediaSession.setActionHandler(action, null); } catch {} });
  }, [backgroundPlaybackEnabled, togglePlay, playPrev, playNext, seek]);

  /* ---------------------- listening-time flush (for the weekly report) ---------------------- */
  const flushListenedSeconds = useCallback(() => {
    const accum = listenAccumRef.current;
    const fps = Object.keys(accum).filter(fp => accum[fp] > 0.25);
    if (fps.length === 0) return;
    setSongs(prev => prev.map(s => {
      const add = accum[s.fingerprint];
      if (!add) return s;
      return { ...s, listenedSeconds: (s.listenedSeconds || 0) + add, weekSeconds: (s.weekSeconds || 0) + add };
    }));
    listenAccumRef.current = {};
  }, []);
  useEffect(() => {
    const iv = setInterval(flushListenedSeconds, 5000);
    return () => { clearInterval(iv); flushListenedSeconds(); };
  }, [flushListenedSeconds]);
  useEffect(() => { flushListenedSeconds(); lastTickRef.current = { fp: null, t: 0 }; }, [currentIndex, flushListenedSeconds]);

  /* ---------------------- weekly listening report ---------------------- */
  useEffect(() => {
    if (!storeLoaded) return;
    const check = () => {
      const WEEK_MS = 7 * 24 * 60 * 60 * 1000;
      if (Date.now() - weekStart < WEEK_MS) return;
      flushListenedSeconds();
      setSongs(prev => {
        const withActivity = prev.filter(s => (s.weekPlays || 0) > 0 || (s.weekSeconds || 0) > 0);
        const top = [...withActivity].sort((a, b) => (b.weekPlays || 0) - (a.weekPlays || 0) || (b.weekSeconds || 0) - (a.weekSeconds || 0)).slice(0, 10)
          .map(s => ({ title: s.title, artist: s.artist, plays: s.weekPlays || 0, seconds: Math.round(s.weekSeconds || 0), rating: s.rating || null }));
        const totalPlays = prev.reduce((sum, s) => sum + (s.weekPlays || 0), 0);
        const totalSeconds = Math.round(prev.reduce((sum, s) => sum + (s.weekSeconds || 0), 0));
        setLastReport({ periodStart: weekStart, periodEnd: Date.now(), totalPlays, totalSeconds, songs: top });
        if (totalPlays > 0) showToast('Your weekly listening report is ready');
        return prev.map(s => ({ ...s, weekPlays: 0, weekSeconds: 0 }));
      });
      setWeekStart(Date.now());
    };
    check();
    const iv = setInterval(check, 60 * 60 * 1000); // re-check hourly
    return () => clearInterval(iv);
  }, [weekStart, storeLoaded, flushListenedSeconds, showToast]);

  /* ---------------------- tap-to-sync: manual lyric timing while the song plays ---------------------- */
  const startTapSync = useCallback(() => {
    const lines = lyricsDraft.split(/\r?\n/)
      .map(l => l.replace(/\[(\d{1,2}):(\d{2})(?:[.:]\d{1,3})?\]/g, '').trim())
      .filter(Boolean);
    if (lines.length === 0) { showToast('Add lyric lines first, then tap to sync them'); return; }
    if (!currentSong) { showToast('Play a song to sync lyrics to it'); return; }
    ensureGraph();
    const el = activeAudioRef.current;
    if (el) { el.currentTime = 0; if (audioCtxRef.current?.state === 'suspended') audioCtxRef.current.resume(); el.play().catch(() => {}); }
    setTapSync({ lines, idx: 0, stamps: [] });
  }, [lyricsDraft, currentSong, activeAudioRef, ensureGraph, showToast]);

  const tapSyncNext = useCallback(() => {
    setTapSync(prev => {
      if (!prev) return prev;
      const t = activeAudioRef.current ? activeAudioRef.current.currentTime : 0;
      const stamps = [...prev.stamps, t];
      const nextIdx = prev.idx + 1;
      if (nextIdx >= prev.lines.length) {
        const lrc = prev.lines.map((line, i) => `[${formatLrcTime(stamps[i])}] ${line}`).join('\n');
        setLyricsDraft(lrc);
        activeAudioRef.current?.pause();
        showToast('Synced! Review the timing, then save.');
        return null;
      }
      return { ...prev, idx: nextIdx, stamps };
    });
  }, [activeAudioRef, showToast]);

  const cancelTapSync = useCallback(() => { activeAudioRef.current?.pause(); setTapSync(null); }, [activeAudioRef]);

  /* ---------------------- keyboard shortcuts ---------------------- */
  useEffect(() => {
    const onKey = (e) => {
      if (['INPUT', 'TEXTAREA'].includes(document.activeElement?.tagName)) return;
      if (e.code === 'Space' && tapSync) { e.preventDefault(); tapSyncNext(); return; }
      if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
      else if (e.code === 'ArrowRight') seek(Math.min(duration, currentTime + 5));
      else if (e.code === 'ArrowLeft') seek(Math.max(0, currentTime - 5));
      else if (e.code === 'ArrowUp') setVolume(v => Math.min(1, v + 0.05));
      else if (e.code === 'ArrowDown') setVolume(v => Math.max(0, v - 0.05));
      else if (e.key === 'm') setMuted(m => !m);
      else if (e.key === 's') setShuffle(s => !s);
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [togglePlay, seek, duration, currentTime, tapSync, tapSyncNext]);

  /* ---------------------- sleep timer ---------------------- */
  useEffect(() => {
    clearTimeout(sleepTimeoutRef.current); clearInterval(sleepIntervalRef.current);
    if (sleepMinutes > 0) {
      const endAt = Date.now() + sleepMinutes * 60000;
      setSleepRemaining(sleepMinutes * 60);
      sleepIntervalRef.current = setInterval(() => { const rem = Math.max(0, Math.round((endAt - Date.now()) / 1000)); setSleepRemaining(rem); if (rem <= 0) clearInterval(sleepIntervalRef.current); }, 1000);
      sleepTimeoutRef.current = setTimeout(() => { activeAudioRef.current?.pause(); setSleepMinutes(0); setSleepRemaining(null); showToast('Sleep timer ended — playback paused'); }, sleepMinutes * 60000);
    } else setSleepRemaining(null);
    return () => { clearTimeout(sleepTimeoutRef.current); clearInterval(sleepIntervalRef.current); };
  }, [sleepMinutes, showToast, activeAudioRef]);

  /* ---------------------------------------------------------------------
     PERSISTENCE — load once, debounce-save metadata/settings/playlists.
     Audio bytes live in IndexedDB (see idbGetAllAudio/idbPutAudio above)
     and are restored below alongside the metadata, so the library is
     playable again immediately after a refresh — no rescan required.
     --------------------------------------------------------------------- */
  useEffect(() => {
    Promise.all([loadStore(), idbGetAllAudio()]).then(async ([data, storedAudio]) => {
      if (data) {
        const s = data.settings || {};
        if (s.themeId) setThemeId(s.themeId);
        if (s.skin) setSkin(s.skin);
        if (s.visualizerStyle) setVisualizerStyle(s.visualizerStyle);
        if (typeof s.ambientEnabled === 'boolean') setAmbientEnabled(s.ambientEnabled);
        if (typeof s.amoled === 'boolean') setAmoled(s.amoled);
        if (Array.isArray(s.eq)) setEq(s.eq);
        if (typeof s.preampDb === 'number') setPreampDb(s.preampDb);
        if (typeof s.crossfadeSeconds === 'number') setCrossfadeSeconds(s.crossfadeSeconds);
        if (typeof s.speed === 'number') setSpeed(s.speed);
        if (typeof s.reducedMotion === 'boolean') setReducedMotion(s.reducedMotion);
        if (typeof s.backgroundPlaybackEnabled === 'boolean') setBackgroundPlaybackEnabled(s.backgroundPlaybackEnabled);
        if (typeof s.weekStart === 'number') setWeekStart(s.weekStart);
        if (Array.isArray(data.playlists)) setPlaylists(data.playlists);
        if (data.library) libraryMetaRef.current = data.library;
        if (data.lastReport) setLastReport(data.lastReport);
        if (s.lastPlayedFingerprint) setLastPlayedFingerprint(s.lastPlayedFingerprint);
      }

      // Picker/folder-imported tracks: raw bytes live in IndexedDB, so they
      // can be rebuilt into playable File objects with no rescan needed.
      let restored = storedAudio.length > 0
        ? storedAudio.map(rec => buildSongFromFile(new File([rec.blob], rec.name, { type: rec.type })))
        : [];

      // Native-linked tracks (Samsung-Music-style device library): no bytes
      // are ever copied, only the content:// reference, so those can't come
      // from IndexedDB. MediaStore is the source of truth for them, so — if
      // permission is already granted from a previous session — silently
      // re-scan it on launch and re-merge each track with its saved
      // metadata (favorites, ratings, play counts, lyrics) via fingerprint.
      // This is what makes native-linked songs "remembered" without the
      // person having to manually re-link their library every time they
      // reopen the app.
      if (window.VinylistNative?.isNative) {
        try {
          const hasPermission = await window.VinylistNative.checkPermission();
          if (hasPermission) {
            const tracks = await window.VinylistNative.scanLibrary();
            const existingFps = new Set(restored.map(s => s.fingerprint));
            const nativeSongs = tracks.filter(t => !existingFps.has(t.id)).map(buildSongFromNativeTrack);
            restored = [...restored, ...nativeSongs];
          }
        } catch { /* best-effort — picker-imported tracks above still restore */ }
      }

      if (restored.length > 0) {
        setSongs(restored);
        // Re-select whichever track was open last time, so the Player/Lyrics
        // screens show it right away instead of looking empty until the
        // person manually taps a song again.
        const wantFp = data?.settings?.lastPlayedFingerprint;
        if (wantFp) {
          const idx = restored.findIndex(s => s.fingerprint === wantFp);
          if (idx !== -1) setCurrentIndex(idx);
        }
        // Re-read embedded ID3 art/tags for the picker-imported tracks in the
        // background — the saved metadata carries title/artist/lyrics, but
        // not artwork (blob URLs can't be persisted), so this restores album
        // art after a restart the same way a fresh import does.
        restored.filter(s => s.file).forEach(song => {
          song.file.arrayBuffer().then(buf => {
            const tags = parseID3(buf);
            if (tags && (tags.title || tags.artist || tags.album || tags.pictureUrl)) {
              setSongs(prev => prev.map(s => s.id === song.id ? {
                ...s,
                title: tags.title || s.title, artist: tags.artist || s.artist, album: tags.album || s.album,
                year: tags.year || s.year, pictureUrl: tags.pictureUrl || s.pictureUrl,
              } : s));
            }
          }).catch(() => {});
        });
      } else if (data?.library) {
        // Metadata survived (older library, or IndexedDB was cleared, and
        // either this isn't the native app or native permission was never
        // granted) but nothing could be restored automatically — fall back
        // to the old "rescan to relink" path.
        setRestoredCount(Object.keys(data.library).length);
      }
      setStoreLoaded(true);
    });
    // Permission state is owned by the browser, not our storage — read it live.
    if (typeof Notification !== 'undefined') setNotificationsEnabled(Notification.permission === 'granted');
    if (navigator.storage?.persisted) {
      navigator.storage.persisted().then(already => {
        setPersistentStorageEnabled(already);
        // Ask up front rather than waiting for the person to find the Settings
        // toggle — this is what actually keeps the browser from evicting the
        // IndexedDB-stored audio/library under storage pressure. Silent/best-
        // effort: some browsers grant it outright, others need the manual
        // "Request" button in Settings (still there) if this is refused.
        if (!already && navigator.storage.persist) {
          navigator.storage.persist().then(setPersistentStorageEnabled).catch(() => {});
        }
      }).catch(() => {});
    }
  }, []);

  useEffect(() => {
    if (!storeLoaded) return;
    const fp = songs[currentIndex]?.fingerprint;
    if (fp && fp !== lastPlayedFingerprint) setLastPlayedFingerprint(fp);
  }, [currentIndex, songs, storeLoaded, lastPlayedFingerprint]);

  // Builds the exact same payload the debounced auto-save below writes —
  // pulled out so it can also be called for an immediate, non-debounced
  // flush (see below). extraSongs lets a caller splice in a value that
  // hasn't round-tripped through React state yet (e.g. lyrics just saved),
  // so an explicit "Save" action can be written to disk instantly instead
  // of waiting on the debounce or on setSongs() re-rendering first.
  const buildStorePayload = useCallback((songsOverride) => {
    const libMap = { ...libraryMetaRef.current };
    (songsOverride || songs).forEach(s => { libMap[s.fingerprint] = { title: s.title, artist: s.artist, album: s.album, liked: !!s.liked, rating: s.rating || null, playCount: s.playCount || 0, listenedSeconds: s.listenedSeconds || 0, weekPlays: s.weekPlays || 0, weekSeconds: s.weekSeconds || 0, lastPlayedAt: s.lastPlayedAt || null, dateAdded: s.dateAdded, lyricsRaw: s.lyrics?.raw || '' }; });
    libraryMetaRef.current = libMap;
    return { settings: { themeId, skin, visualizerStyle, ambientEnabled, amoled, eq, preampDb, crossfadeSeconds, speed, reducedMotion, backgroundPlaybackEnabled, weekStart, lastPlayedFingerprint }, playlists, library: libMap, lastReport };
  }, [songs, playlists, themeId, skin, visualizerStyle, ambientEnabled, amoled, eq, preampDb, crossfadeSeconds, speed, reducedMotion, backgroundPlaybackEnabled, weekStart, lastReport, lastPlayedFingerprint]);

  useEffect(() => {
    if (!storeLoaded) return;
    const t = setTimeout(() => { saveStore(buildStorePayload()); }, 700);
    return () => clearTimeout(t);
  }, [buildStorePayload, storeLoaded]);

  // The 700ms debounce above is fine while the app stays open (it just
  // coalesces rapid changes), but it's a real data-loss window if the app
  // is closed/killed right after an edit — lyrics saved and then the app
  // swiped away a beat later would simply never get written. The moment
  // the app is backgrounded is the last reliable point to flush, so do it
  // immediately here rather than trusting the pending timer to fire.
  useEffect(() => {
    if (!storeLoaded) return;
    const flushNow = () => { saveStore(buildStorePayload()); };
    const onVisibility = () => { if (document.hidden) flushNow(); };
    document.addEventListener('visibilitychange', onVisibility);
    window.addEventListener('pagehide', flushNow);
    window.addEventListener('blur', flushNow);
    return () => {
      document.removeEventListener('visibilitychange', onVisibility);
      window.removeEventListener('pagehide', flushNow);
      window.removeEventListener('blur', flushNow);
    };
  }, [buildStorePayload, storeLoaded]);

  /* ---------------------------------------------------------------------
     APP UPDATES — the native build installs a new APK in place; Android
     keeps the app's on-device storage across that, so the library
     (IndexedDB) and lyrics/playlists/settings (localStorage) above are
     never touched by an update. Nothing to detect or apply here.
     --------------------------------------------------------------------- */

  // Refreshing or closing the tab discards the in-memory audio files (browsers
  // never persist raw file access across a reload — only the metadata above
  // survives, via the store). Nudge the user with the native "leave site?"
  // confirmation so a stray pull-to-refresh doesn't silently drop the library.
  useEffect(() => {
    const handler = (e) => {
      if (songs.length === 0) return;
      e.preventDefault();
      e.returnValue = '';
    };
    window.addEventListener('beforeunload', handler);
    return () => window.removeEventListener('beforeunload', handler);
  }, [songs.length]);

  /* ---------------------------------------------------------------------
     FILE IMPORT — "storage scan" via folder picker (webkitdirectory) or
     multi-file picker; each file is fingerprinted, tag-parsed for real
     metadata + embedded art, and relinked to any restored library entry.
     --------------------------------------------------------------------- */
  const buildSongFromFile = useCallback((file) => {
    const fp = fingerprintOf(file);
    const saved = libraryMetaRef.current[fp];
    return {
      id: nextId(), fingerprint: fp, file, url: URL.createObjectURL(file),
      title: saved?.title || nameFromFile(file.name),
      artist: saved?.artist || 'Unknown Artist',
      album: saved?.album || '',
      year: '', pictureUrl: null,
      liked: saved?.liked || false,
      rating: saved?.rating || null, // 'up' | 'down' | null
      playCount: saved?.playCount || 0,
      listenedSeconds: saved?.listenedSeconds || 0,
      weekPlays: saved?.weekPlays || 0,
      weekSeconds: saved?.weekSeconds || 0,
      lastPlayedAt: saved?.lastPlayedAt || null,
      dateAdded: saved?.dateAdded || Date.now(),
      lyrics: saved?.lyricsRaw ? parseLyrics(saved.lyricsRaw) : null,
    };
  }, []);

  const handleFiles = useCallback((fileList) => {
    const files = Array.from(fileList).filter(f => f.type.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|flac|aac)$/i.test(f.name));
    if (files.length === 0) { showToast('No audio files found'); return; }
    const newSongs = files.map(buildSongFromFile);
    newSongs.forEach(song => idbPutAudio(song.fingerprint, song.file));
    setSongs(prev => {
      // Re-scanning the same folder (e.g. the "rescan to relink" fallback,
      // or just picking the same files twice) shouldn't create a second
      // entry for a track that's already in the library.
      const existingFps = new Set(prev.map(s => s.fingerprint));
      const wasEmpty = prev.length === 0;
      const deduped = newSongs.filter(s => !existingFps.has(s.fingerprint));
      const merged = [...prev, ...deduped];
      if (wasEmpty) setTimeout(() => setCurrentIndex(0), 0);
      return merged;
    });
    showToast(`Indexed ${files.length} track${files.length > 1 ? 's' : ''}`);
    newSongs.forEach(song => {
      song.file.arrayBuffer().then(buf => {
        const tags = parseID3(buf);
        if (tags && (tags.title || tags.artist || tags.album || tags.pictureUrl)) {
          setSongs(prev => prev.map(s => s.id === song.id ? {
            ...s,
            title: tags.title || s.title, artist: tags.artist || s.artist, album: tags.album || s.album,
            year: tags.year || s.year, pictureUrl: tags.pictureUrl || s.pictureUrl,
          } : s));
        }
      }).catch(() => {});
    });
  }, [showToast, buildSongFromFile]);

  /* Native path: pull the device's audio index via MediaStore and reference
     each track by its content:// URI — no bytes are copied, so this doesn't
     touch device storage the way the picker+blob path below does. Only runs
     inside the Capacitor-wrapped app; no-ops (returns []) on the web/PWA.
     Shared with the startup-restore effect above, so a fresh manual scan
     and an automatic relaunch scan build identical song objects. */
  const buildSongFromNativeTrack = useCallback((t) => {
    const fp = t.id; // MediaStore row id is already a stable per-device fingerprint
    const saved = libraryMetaRef.current[fp];
    return {
      id: nextId(), fingerprint: fp, file: null, url: t.playableSrc, nativeUri: t.uri,
      title: saved?.title || t.title || nameFromFile(t.title || 'Unknown'),
      artist: saved?.artist || t.artist || 'Unknown Artist',
      album: saved?.album || t.album || '',
      year: '', pictureUrl: null,
      liked: saved?.liked || false, rating: saved?.rating || null,
      playCount: saved?.playCount || 0, listenedSeconds: saved?.listenedSeconds || 0,
      weekPlays: saved?.weekPlays || 0, weekSeconds: saved?.weekSeconds || 0,
      lastPlayedAt: saved?.lastPlayedAt || null, dateAdded: saved?.dateAdded || (t.dateAddedSec ? t.dateAddedSec * 1000 : Date.now()),
      lyrics: saved?.lyricsRaw ? parseLyrics(saved.lyricsRaw) : null,
    };
  }, []);

  const importFromNativeLibrary = useCallback(async () => {
    if (!window.VinylistNative?.isNative) { showToast('Native library scan is only available in the installed app'); return; }
    const tracks = await window.VinylistNative.scanLibrary();
    if (tracks.length === 0) { showToast('No tracks found, or permission was declined'); return; }
    const newSongs = tracks.map(buildSongFromNativeTrack);
    setSongs(prev => {
      const existingFps = new Set(prev.map(s => s.fingerprint));
      const merged = [...prev, ...newSongs.filter(s => !existingFps.has(s.fingerprint))];
      if (prev.length === 0) setTimeout(() => setCurrentIndex(0), 0);
      return merged;
    });
    showToast(`Linked ${newSongs.length} track${newSongs.length !== 1 ? 's' : ''} from your device library`);
  }, [showToast, buildSongFromNativeTrack]);

  const onFileInputChange = (e) => { if (e.target.files?.length) handleFiles(e.target.files); e.target.value = ''; };
  const onFolderInputChange = (e) => { if (e.target.files?.length) handleFiles(e.target.files); e.target.value = ''; };
  const onDrop = (e) => { e.preventDefault(); if (e.dataTransfer.files?.length) handleFiles(e.dataTransfer.files); };
  const onDragOver = (e) => e.preventDefault();

  const removeSong = (idx) => {
    setSongs(prev => { const copy = [...prev]; const [removed] = copy.splice(idx, 1); if (removed?.url) URL.revokeObjectURL(removed.url); if (removed?.fingerprint) idbDeleteAudio(removed.fingerprint); return copy; });
    if (idx === currentIndex) { setIsPlaying(false); setCurrentIndex(-1); }
    else if (idx < currentIndex) setCurrentIndex(i => i - 1);
  };

  const toggleLike = useCallback((idx) => setSongs(prev => prev.map((s, i) => i === idx ? { ...s, liked: !s.liked } : s)), []);
  const setRating = useCallback((idx, value) => setSongs(prev => prev.map((s, i) => i === idx ? { ...s, rating: s.rating === value ? null : value } : s)), []);

  const reorder = useCallback((from, to) => {
    setSongs(prev => { const copy = [...prev]; const [moved] = copy.splice(from, 1); copy.splice(to, 0, moved); return copy; });
    setCurrentIndex(ci => { if (ci === from) return to; if (from < ci && to >= ci) return ci - 1; if (from > ci && to <= ci) return ci + 1; return ci; });
  }, []);

  // Reorders a playlist's own track order (its fingerprints array), leaving
  // the full library untouched. fromFp/toFp are the fingerprints of the
  // tracks being dragged, since a playlist's on-screen position never lines
  // up with its songs' indices in the full library.
  const reorderPlaylist = useCallback((playlistId, fromFp, toFp) => {
    setPlaylists(prev => prev.map(p => {
      if (p.id !== playlistId) return p;
      const list = [...p.fingerprints];
      const fromPos = list.indexOf(fromFp), toPos = list.indexOf(toFp);
      if (fromPos === -1 || toPos === -1) return p;
      const [moved] = list.splice(fromPos, 1);
      list.splice(toPos, 0, moved);
      return { ...p, fingerprints: list };
    }));
  }, []);

  /* ---------------------- playlists ---------------------- */
  const createPlaylist = (fingerprintToAdd) => {
    const name = newPlaylistName.trim(); if (!name) return;
    setPlaylists(prev => [...prev, { id: 'pl-' + Date.now(), name, fingerprints: fingerprintToAdd ? [fingerprintToAdd] : [] }]);
    setNewPlaylistName('');
    showToast('Playlist saved');
    // Closes the "Add to playlist" sheet, if that's where this was called
    // from — a no-op when creating one from the always-visible Library row.
    setAddToPlaylistFor(null);
  };
  const togglePlaylistMembership = (playlistId, fingerprint) => {
    setPlaylists(prev => prev.map(p => p.id !== playlistId ? p : {
      ...p, fingerprints: p.fingerprints.includes(fingerprint) ? p.fingerprints.filter(f => f !== fingerprint) : [...p.fingerprints, fingerprint],
    }));
  };
  const deletePlaylist = (playlistId) => { setPlaylists(prev => prev.filter(p => p.id !== playlistId)); if (listFilter === 'playlist:' + playlistId) setListFilter('all'); };

  /* ---------------------- lyrics ---------------------- */
  useEffect(() => { setLyricsDraft(currentSong?.lyrics?.raw || ''); setEditingLyrics(false); }, [currentIndex]);
  const saveLyrics = () => {
    const parsed = parseLyrics(lyricsDraft);
    const newLyrics = parsed ? { raw: lyricsDraft, ...parsed } : null;
    const nextSongs = songs.map((s, i) => i === currentIndex ? { ...s, lyrics: newLyrics } : s);
    setSongs(nextSongs);
    setEditingLyrics(false); showToast('Lyrics saved');
    // Explicit save action — write to disk right away instead of waiting on
    // the passive debounce, so lyrics survive even if the app is closed a
    // moment later. nextSongs is passed directly since setSongs() above
    // hasn't re-rendered yet at this point.
    saveStore(buildStorePayload(nextSongs));
  };

  const activeLyricIndex = useMemo(() => {
    const ly = currentSong?.lyrics; if (!ly) return -1;
    // Only real LRC timestamps drive the active-line highlight. Plain lyrics
    // with no timestamps are shown as-is, with no guessed/estimated position —
    // there's no reliable way to detect song position from text alone.
    if (ly.synced) { let idx = -1; for (let i = 0; i < ly.lines.length; i++) { if (ly.lines[i].time <= currentTime) idx = i; else break; } return idx; }
    return -1;
  }, [currentSong, currentTime]);
  useEffect(() => { if (activeLyricRef.current && tab === 'lyrics') activeLyricRef.current.scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block: 'center' }); }, [activeLyricIndex, tab, reducedMotion]);

  /* ---------------------- waveform (per current song) ---------------------- */
  useEffect(() => {
    let cancelled = false;
    setWaveform(null);
    if (!currentSong?.file) return;
    setWaveformLoading(true);
    computeWaveform(currentSong.file).then(w => { if (!cancelled) { setWaveform(w); setWaveformLoading(false); } });
    return () => { cancelled = true; };
  }, [currentIndex]);

  /* ---------------------- ambient palette (per current song art) ---------------------- */
  useEffect(() => {
    if (!currentSong?.pictureUrl) { setPalette(null); return; }
    let cancelled = false;
    extractPalette(currentSong.pictureUrl).then(p => { if (!cancelled) setPalette(p); });
    return () => { cancelled = true; };
  }, [currentSong?.pictureUrl]);

  /* ---------------------- shared-element transition trigger ---------------------- */
  const triggerSharedTransition = useCallback((rect, pictureUrl) => { setSharedTransition({ rect, pictureUrl, key: Date.now() }); }, []);

  const progressFrac = duration ? currentTime / duration : 0;
  const VolIcon = muted || volume === 0 ? VolumeX : volume < 0.5 ? Volume1 : Volume2;
  const RepeatIcon = repeatMode === 'one' ? Repeat1 : Repeat;

  /* ---------------------- mini player elastic drag ---------------------- */
  const onMiniPointerDown = (e) => { miniDragStartRef.current = (e.touches ? e.touches[0].clientY : e.clientY); };
  const onMiniPointerMove = (e) => {
    if (miniDragStartRef.current == null) return;
    const y = e.touches ? e.touches[0].clientY : e.clientY;
    setMiniDragY(Math.min(0, (y - miniDragStartRef.current) * -1) * -1 <= 0 ? Math.min(0, y - miniDragStartRef.current) : 0);
  };
  const onMiniPointerUp = () => {
    if (miniDragStartRef.current == null) return;
    if (miniDragY < -46) setTab('player');
    setMiniDragY(0); miniDragStartRef.current = null;
  };

  const rootStyle = { color: theme.text, fontFamily: "'Manrope', system-ui, sans-serif", height: '100vh', display: 'flex', flexDirection: 'column', position: 'relative', overflow: 'hidden', '--neu-light': neu.light, '--neu-dark': neu.dark, '--neu-bg': theme.bg };

  return (
    <div className="app-root" style={rootStyle} onMouseMove={onMiniPointerMove} onMouseUp={onMiniPointerUp} onTouchMove={onMiniPointerMove} onTouchEnd={onMiniPointerUp}>
      {consentAccepted === false && (
        <div style={{ position: 'fixed', left: 0, right: 0, bottom: 0, zIndex: 9999, background: theme.surface, borderTop: `1px solid ${theme.surface2}`, padding: '14px 18px', boxShadow: '0 -6px 24px rgba(0,0,0,0.35)' }}>
          <div style={{ fontSize: 12.5, color: theme.text, lineHeight: 1.5, marginBottom: 10 }}>
            By using Vinylist you agree to our{' '}
            <span style={{ color: theme.accent, fontWeight: 700, cursor: 'pointer' }} onClick={() => setTab('settings')}>Terms</span>
            {' '}and{' '}
            <span style={{ color: theme.accent, fontWeight: 700, cursor: 'pointer' }} onClick={() => setTab('settings')}>Privacy Policy</span>.
            All your data stays on this device — there's no account or cloud sync.
          </div>
          <button onClick={acceptConsent} className="press" style={{ background: theme.accent, color: theme.bg, border: 'none', borderRadius: 999, padding: '9px 20px', fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>Got it</button>
        </div>
      )}
      <style>{`
        @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Manrope:wght@400;500;600;700;800&display=swap');
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: ${theme.surface2}; border-radius: 4px; }
        @keyframes fadeUp { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes fadeInSlow { from { opacity: 0; } }
        .fade-up { animation: fadeUp 260ms ease both; }
        .fade-in-slow { animation: fadeInSlow 1000ms ease both; }
        @keyframes vySpinIcon { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .vy-spin { animation: vySpinIcon 900ms linear infinite; }
        .tabbtn { transition: color 150ms ease, transform 120ms ease; }
        .tabbtn:active { transform: scale(0.94); }
        .rowhover:hover { background: ${theme.surface2}; }
        .press:active { transform: scale(0.97); }
        /* Glassmorphism — -webkit-backdrop-filter must come first for Safari/iOS
           WKWebView (the runtime used once this app is wrapped for the App Store);
           without it the property is silently ignored and the panel just looks flat. */
        .glasspanel {
          background: ${theme.surface}99;
          -webkit-backdrop-filter: blur(20px) saturate(160%);
          backdrop-filter: blur(20px) saturate(160%);
          border: 1px solid rgba(255,255,255,0.08);
          box-shadow: 0 8px 32px -12px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        /* Fallback for the rare engine with zero backdrop-filter support, so the
           UI still reads correctly instead of turning semi-transparent-on-nothing. */
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
          .glasspanel { background: ${theme.surface}f2; }
        }
        .glasspanel-lite {
          background: ${theme.surface}77;
          -webkit-backdrop-filter: blur(14px) saturate(150%);
          backdrop-filter: blur(14px) saturate(150%);
          border: 1px solid rgba(255,255,255,0.06);
        }
        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
          .glasspanel-lite { background: ${theme.surface}e6; }
        }
        /* Neumorphism — soft-extruded UI. Every element shares the page's own background
           and is shaped purely by a light/dark shadow pair, so it works on top of any
           color theme via the --neu-light / --neu-dark / --neu-bg custom properties set
           once on the app root (see rootStyle). No border is used anywhere in this skin. */
        .neupanel {
          background: var(--neu-bg);
          border: none;
          box-shadow: 8px 8px 16px var(--neu-dark), -8px -8px 16px var(--neu-light);
        }
        .neupanel-lite {
          background: var(--neu-bg);
          border: none;
          box-shadow: 5px 5px 10px var(--neu-dark), -5px -5px 10px var(--neu-light);
        }
        .neupanel-inset {
          background: var(--neu-bg);
          border: none;
          box-shadow: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light);
        }
        .neupanel-circle {
          background: var(--neu-bg);
          border: none;
          box-shadow: 6px 6px 12px var(--neu-dark), -6px -6px 12px var(--neu-light);
        }
        .neupanel-circle-sm {
          background: var(--neu-bg);
          border: none;
          box-shadow: 4px 4px 8px var(--neu-dark), -4px -4px 8px var(--neu-light);
        }
        .neu-press:active {
          box-shadow: inset 4px 4px 8px var(--neu-dark), inset -4px -4px 8px var(--neu-light) !important;
        }
      `}</style>

      <div style={{ position: 'absolute', inset: 0, zIndex: 0 }}>
        <AmbientBackground palette={palette} theme={theme} amoled={amoled} enabled={ambientEnabled} />
      </div>

      <input ref={fileInputRef} type="file" accept="audio/*" multiple style={{ display: 'none' }} onChange={onFileInputChange} />
      <input ref={folderInputRef} type="file" accept="audio/*" multiple webkitdirectory="" directory="" style={{ display: 'none' }} onChange={onFolderInputChange} />

      <audio ref={audioARef} onPlay={() => activeSlot === 'A' && setIsPlaying(true)} onPause={() => activeSlot === 'A' && setIsPlaying(false)} onTimeUpdate={handleTimeUpdate} onLoadedMetadata={e => activeSlot === 'A' && setDuration(e.currentTarget.duration || 0)} onEnded={handleEnded} />
      <audio ref={audioBRef} onPlay={() => activeSlot === 'B' && setIsPlaying(true)} onPause={() => activeSlot === 'B' && setIsPlaying(false)} onTimeUpdate={handleTimeUpdate} onLoadedMetadata={e => activeSlot === 'B' && setDuration(e.currentTarget.duration || 0)} onEnded={handleEnded} />

      <SharedElementOverlay transition={sharedTransition} theme={theme} />

      {/* Header */}
      <div className={skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined} style={{ position: 'relative', zIndex: 1, display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: '18px 20px', margin: skin === 'glass' ? '10px 12px 0' : 0, borderRadius: skin === 'glass' ? 18 : 0 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 8 }}>
          <Disc3 size={22} color={theme.accent} />
          <span style={{ fontFamily: "'Fraunces', serif", fontWeight: 600, fontSize: 19, letterSpacing: 0.2 }}>Vinylist</span>
        </div>
        <div style={{ flex: 1, textAlign: 'center', fontSize: 10.5, color: theme.muted, letterSpacing: 1.2, textTransform: 'uppercase', opacity: 0.7 }}>by Francis&M_Tech</div>
        <div className={skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined} style={{ fontSize: 11, color: theme.muted, background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}cc`, padding: '5px 10px', borderRadius: 999 }}>{theme.name}</div>
      </div>

      {/* Main content */}
      <div style={{ position: 'relative', zIndex: 1, flex: 1, overflowY: 'auto', padding: '4px 20px 210px' }}>
        {tab === 'player' && (
          <PlayerView
            theme={theme} currentSong={currentSong} songs={songs} skin={skin}
            isPlaying={isPlaying} currentTime={currentTime} duration={duration}
            shuffle={shuffle} repeatMode={repeatMode} RepeatIcon={RepeatIcon}
            togglePlay={togglePlay} playNext={playNext} playPrev={playPrev}
            setShuffle={setShuffle} cycleRepeat={cycleRepeat} seek={seek}
            volume={volume} setVolume={setVolume} muted={muted} setMuted={setMuted} VolIcon={VolIcon}
            toggleLike={() => toggleLike(currentIndex)} setRating={(v) => setRating(currentIndex, v)}
            setAddToPlaylistFor={() => setAddToPlaylistFor(currentIndex)}
            fileInputRef={fileInputRef} folderInputRef={folderInputRef} onDrop={onDrop} onDragOver={onDragOver}
            getLevels={getLevels} getLevelL={getLevelL} getLevelR={getLevelR} reducedMotion={reducedMotion}
            speed={speed} sleepMinutes={sleepMinutes} sleepRemaining={sleepRemaining}
            waveform={waveform} waveformLoading={waveformLoading} progressFrac={progressFrac}
            crossfadeSeconds={crossfadeSeconds} visualizerStyle={visualizerStyle}
            importFromNativeLibrary={importFromNativeLibrary}
          />
        )}
        {tab === 'queue' && (
          <QueueView
            theme={theme} skin={skin} songs={filteredSongs} currentIndex={currentIndex}
            playIndex={(idx, rect, pictureUrl) => { setQueueContext({ filter: listFilter, search }); if (rect) triggerSharedTransition(rect, pictureUrl); playIndex(idx); setTab('player'); }}
            removeSong={removeSong} toggleLike={toggleLike}
            search={search} setSearch={setSearch}
            listFilter={listFilter} setListFilter={setListFilter} playlists={playlists}
            fileInputRef={fileInputRef} folderInputRef={folderInputRef} onDrop={onDrop} onDragOver={onDragOver}
            dragIndex={dragIndex} setDragIndex={setDragIndex} reorder={reorder}
            dragFingerprint={dragFingerprint} setDragFingerprint={setDragFingerprint} reorderPlaylist={reorderPlaylist}
            isPlaying={isPlaying} setAddToPlaylistFor={setAddToPlaylistFor}
            newPlaylistName={newPlaylistName} setNewPlaylistName={setNewPlaylistName} createPlaylist={createPlaylist}
            deletePlaylist={deletePlaylist}
            restoredCount={restoredCount}
          />
        )}
        {tab === 'lyrics' && (
          <LyricsView
            theme={theme} currentSong={currentSong}
            editingLyrics={editingLyrics} setEditingLyrics={setEditingLyrics}
            lyricsDraft={lyricsDraft} setLyricsDraft={setLyricsDraft} saveLyrics={saveLyrics}
            activeLyricIndex={activeLyricIndex} lyricsScrollRef={lyricsScrollRef} activeLyricRef={activeLyricRef}
            seek={seek} reducedMotion={reducedMotion}
            tapSync={tapSync} startTapSync={startTapSync} tapSyncNext={tapSyncNext} cancelTapSync={cancelTapSync}
          />
        )}
        {tab === 'report' && (
          <ReportView theme={theme} skin={skin} lastReport={lastReport} songs={songs} weekStart={weekStart} />
        )}

/**
 * Polls the analyser at animation-frame rate to drive the pulsing glow
 * behind the vinyl disc. Deliberately its own component with its own local
 * `level` state: this is the only thing in the app that needs to update on
 * every frame, so it's the only thing that should re-render on every frame.
 * It's also only ever mounted while the Player tab + disc visualizer are
 * showing, and only polls while a song is actually playing.
 */
function DiscGlow({ theme, isPlaying, getLevels }) {
  const [level, setLevel] = useState(0);
  useEffect(() => {
    if (!isPlaying) { setLevel(0); return; }
    let raf;
    const tick = () => {
      const d = getLevels();
      if (d && d.length) { let s = 0; for (let i = 0; i < Math.min(24, d.length); i++) s += d[i]; setLevel(s / (24 * 255)); }
      raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [isPlaying, getLevels]);
  return (
    <div style={{ position: 'absolute', inset: -18, borderRadius: '50%', background: `radial-gradient(circle, ${theme.accent}55, transparent 70%)`, opacity: isPlaying ? 0.25 + Math.min(level, 1) * 0.5 : 0.15, transition: 'opacity 200ms ease', filter: 'blur(6px)' }} />
  );
}

/**
 * Neumorphism's signature "now playing" visual: a large raised circular
 * dial (same soft-extruded material as every other neu surface — no album
 * art, no solid fill) with a small dipped "socket" sunk into its center
 * holding a compact live bar meter, plus the same accent-colored ambient
 * glow used behind every disc. This is what distinguishes the neu skin's
 * player screen from the vinyl-disc/visualizer treatment the other skins
 * use — same idea as TapeDeck being the tape skin's dedicated visual.
 */
function NeuWaveformDial({ theme, isPlaying, getLevels, reducedMotion, size = 216 }) {
  const socketSize = Math.round(size * 0.5);
  const barsW = Math.round(socketSize * 0.6), barsH = Math.round(socketSize * 0.38);
  return (
    <div style={{ position: 'relative', width: size, height: size }}>
      <DiscGlow theme={theme} isPlaying={isPlaying} getLevels={getLevels} />
      <div className="neupanel-circle" style={{ position: 'relative', width: size, height: size, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
        <div className="neupanel-inset" style={{ width: socketSize, height: socketSize, borderRadius: '50%', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
          <div style={{ width: barsW, height: barsH }}>
            <Visualizer getLevels={getLevels} playing={isPlaying} theme={theme} bars={5} reducedMotion={reducedMotion} style="bars" />
          </div>
        </div>
      </div>
    </div>
  );
}

  const draggableEnabled = listFilter === 'all' || listFilter === 'favorites' || isSinglePlaylist;

  const albumGroups = useMemo(() => {
    if (!isAlbumView) return null;
    const map = new Map();

      {isPlaylistsHub ? (
        <PlaylistsHub theme={theme} skin={skin} playlists={playlists} setListFilter={setListFilter} deletePlaylist={deletePlaylist}
          newPlaylistName={newPlaylistName} setNewPlaylistName={setNewPlaylistName} createPlaylist={createPlaylist} />
      ) : (
        <>
          {isSinglePlaylist && (
            <button onClick={() => setListFilter('playlists')} className="press" style={{ display: 'flex', alignItems: 'center', gap: 6, background: 'none', border: 'none', color: theme.muted, cursor: 'pointer', fontSize: 12.5, fontWeight: 600, padding: '0 2px', marginBottom: 10 }}>
              <ArrowLeft size={14} /> Playlists {activePlaylist ? `· ${activePlaylist.name}` : ''}
            </button>
          )}

          {songs.length === 0 ? (
            <div style={{ color: theme.muted, fontSize: 13, textAlign: 'center', padding: '40px 10px' }}>
              {isAlbumView ? 'No albums yet — add some tracks first.' : listFilter === 'recentlyPlayed' ? 'Nothing played yet this session.' : isSinglePlaylist ? 'No tracks in this playlist yet.' : 'Nothing here yet.'}
            </div>
          ) : isAlbumView ? (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 18 }}>
              {albumGroups.map(([albumName, tracks]) => (
                <div key={albumName}>
                  <div style={{ display: 'flex', alignItems: 'center', gap: 8, marginBottom: 6, padding: '0 4px' }}>
                    <Disc3 size={13} color={theme.muted} />
                    <span style={{ fontSize: 12.5, fontWeight: 700, color: theme.muted }}>{albumName}</span>
                    <span style={{ fontSize: 11, color: theme.muted, opacity: 0.7 }}>· {tracks.length} track{tracks.length !== 1 ? 's' : ''}</span>
                  </div>
                  <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
                    {tracks.map(s => (
                      <SongRow key={s.id} s={s} theme={theme} skin={skin} currentIndex={currentIndex} isPlaying={isPlaying}
                        playIndex={playIndex} onRowDragStart={handleRowDragStart} onRowDrop={handleRowDrop}
                        setAddToPlaylistFor={setAddToPlaylistFor} toggleLike={toggleLike} removeSong={removeSong}
                        draggable={false} highlighted={s._idx === highlightIdx} />
                    ))}
                  </div>
                </div>
              ))}
            </div>
          ) : (
            <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
              {songs.map((s) => (
                <SongRow key={s.id} s={s} theme={theme} skin={skin} currentIndex={currentIndex} isPlaying={isPlaying}
                  playIndex={playIndex} onRowDragStart={handleRowDragStart} onRowDrop={handleRowDrop}
                  setAddToPlaylistFor={setAddToPlaylistFor} toggleLike={toggleLike} removeSong={removeSong}
                  draggable={draggableEnabled} highlighted={s._idx === highlightIdx} />
              ))}
            </div>
          )}
        </>
      )}
    </div>
  );
}

function PlaylistsHub({ theme, skin, playlists, setListFilter, deletePlaylist, newPlaylistName, setNewPlaylistName, createPlaylist }) {
  const panelClass = skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined;
  const panelBg = skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`;
  return (
    <div>
      <div style={{ display: 'flex', gap: 8, marginBottom: 16 }}>
        <input value={newPlaylistName} onChange={e => setNewPlaylistName(e.target.value)} placeholder="New playlist name" style={{ flex: 1, background: `${theme.surface}dd`, border: `1px solid ${theme.surface2}`, borderRadius: 10, padding: '9px 10px', color: theme.text, fontSize: 12.5, outline: 'none' }} onKeyDown={e => e.key === 'Enter' && createPlaylist()} />
        <button onClick={createPlaylist} className="press" style={{ background: theme.surface2, color: theme.text, border: 'none', borderRadius: 10, padding: '0 14px', cursor: 'pointer', fontSize: 12.5, fontWeight: 700 }}>Create</button>
      </div>
      {playlists.length === 0 ? (
        <div style={{ color: theme.muted, fontSize: 13, textAlign: 'center', padding: '40px 10px' }}>No playlists yet — create one above.</div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
          {playlists.map(p => (
            <div key={p.id} className={panelClass} style={{ position: 'relative', display: 'flex', alignItems: 'center', gap: 12, background: panelBg, borderRadius: 14, padding: '13px 16px' }}>
              <button onClick={() => setListFilter('playlist:' + p.id)} className="rowhover" style={{ flex: 1, display: 'flex', alignItems: 'center', gap: 12, background: 'none', border: 'none', textAlign: 'left', cursor: 'pointer', color: theme.text, padding: 0 }}>
                <div style={{ width: 40, height: 40, borderRadius: 10, flexShrink: 0, background: `linear-gradient(135deg, ${theme.accent2}, ${theme.accent})`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                  <ListMusic size={17} color={theme.bg} />
                </div>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13.5, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{p.name}</div>
                  <div style={{ fontSize: 11.5, color: theme.muted }}>{p.fingerprints.length} track{p.fingerprints.length !== 1 ? 's' : ''}</div>
                </div>
                <ChevronRight size={16} color={theme.muted} />
              </button>
              <button onClick={() => deletePlaylist(p.id)} title="Delete playlist" style={{ position: 'absolute', top: -6, right: -6, width: 18, height: 18, borderRadius: '50%', background: theme.surface2, border: 'none', color: theme.muted, cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center' }}><X size={11} /></button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const SongRow = React.memo(function SongRow({ s, theme, skin, currentIndex, isPlaying, playIndex, onRowDragStart, onRowDrop, setAddToPlaylistFor, toggleLike, removeSong, draggable, highlighted }) {
  return (
    <div
      data-song-idx={s._idx}
      draggable={draggable}
      onDragStart={() => draggable && onRowDragStart(s)}
      onDragOver={e => draggable && e.preventDefault()}
      onDrop={e => { if (!draggable) return; e.stopPropagation(); onRowDrop(s); }}
      className="rowhover"
      style={{
        display: 'flex', alignItems: 'center', gap: 10, padding: '8px 8px', borderRadius: 12,
        background: highlighted ? `${theme.accent}26` : (s._idx === currentIndex ? `${theme.surface}dd` : 'transparent'),
        boxShadow: highlighted ? `0 0 0 1.5px ${theme.accent}` : 'none',
        transition: 'background 350ms ease, box-shadow 350ms ease',
      }}
    >
      {draggable && <GripVertical size={15} color={theme.muted} style={{ cursor: 'grab', flexShrink: 0 }} />}
      <button
        onClick={(e) => { const rect = e.currentTarget.getBoundingClientRect(); playIndex(s._idx, rect, s.pictureUrl); }}
        style={{ width: 36, height: 36, borderRadius: 10, flexShrink: 0, border: 'none', cursor: 'pointer', overflow: 'hidden', background: s.pictureUrl ? `center/cover url(${s.pictureUrl})` : `linear-gradient(135deg, ${theme.accent2}, ${theme.accent})`, display: 'flex', alignItems: 'center', justifyContent: 'center' }}
      >
        {!s.pictureUrl && (s._idx === currentIndex && isPlaying ? <Pause size={14} color={theme.bg} /> : <Play size={14} color={theme.bg} style={{ marginLeft: 1 }} />)}
      </button>
      <div onClick={(e) => { const rect = e.currentTarget.parentElement.querySelector('button').getBoundingClientRect(); playIndex(s._idx, rect, s.pictureUrl); }} style={{ flex: 1, minWidth: 0, cursor: 'pointer' }}>
        <div style={{ fontSize: 13.5, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis', color: s._idx === currentIndex ? theme.accent : theme.text }}>{s.title}</div>
        <div style={{ fontSize: 11.5, color: theme.muted, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.artist}{s.playCount ? ` · ${s.playCount} plays` : ''}</div>
      </div>
      {s.lyrics && <Mic2 size={13} color={theme.muted} style={{ flexShrink: 0 }} />}
      <IconButton theme={theme} skin={skin} size="sm" label="Add to playlist" onClick={() => setAddToPlaylistFor(s._idx)}><ListPlus size={15} color={theme.muted} /></IconButton>
      <IconButton theme={theme} skin={skin} size="sm" label="Like" onClick={() => toggleLike(s._idx)}><Heart size={15} fill={s.liked ? theme.accent : 'none'} color={s.liked ? theme.accent : theme.muted} /></IconButton>
      <IconButton theme={theme} skin={skin} size="sm" label="Remove" onClick={() => removeSong(s._idx)}><Trash2 size={15} color={theme.muted} /></IconButton>
    </div>
  );
});

function AddToPlaylistSheet({ theme, skin, song, playlists, onToggle, onClose, newPlaylistName, setNewPlaylistName, createPlaylist }) {
  if (!song) return null;
  return (
    <div style={{ position: 'fixed', inset: 0, zIndex: 40, display: 'flex', alignItems: 'flex-end', background: 'rgba(0,0,0,0.5)' }} onClick={onClose}>
      <div className={`fade-up ${skin === 'glass' ? 'glasspanel' : skin === 'neu' ? 'neupanel' : ''}`} onClick={e => e.stopPropagation()} style={{ width: '100%', borderRadius: '20px 20px 0 0', padding: 20, maxHeight: '70vh', overflowY: 'auto', background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : theme.surface }}>
        <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: 14 }}>
          <div style={{ fontWeight: 700, fontSize: 14 }}>Add "{song.title}" to…</div>
          <IconButton theme={theme} skin={skin} size="sm" label="Close" onClick={onClose}><X size={16} /></IconButton>
        </div>
        {playlists.length === 0 && <div style={{ fontSize: 12.5, color: theme.muted, marginBottom: 14 }}>No playlists yet — create one below.</div>}
        <div style={{ display: 'flex', flexDirection: 'column', gap: 4, marginBottom: 14 }}>
          {playlists.map(p => {
            const has = p.fingerprints.includes(song.fingerprint);
            return (
              <button key={p.id} onClick={() => onToggle({ playlistId: p.id, fingerprint: song.fingerprint })} className="rowhover press" style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', background: 'none', border: 'none', borderRadius: 10, padding: '10px 8px', cursor: 'pointer', color: theme.text }}>
                <span style={{ fontSize: 13.5 }}>{p.name}</span>
                <div style={{ width: 20, height: 20, borderRadius: 5, border: `1.5px solid ${has ? theme.accent : theme.muted}`, background: has ? theme.accent : 'transparent', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>{has && <Check size={13} color={theme.bg} />}</div>
              </button>
            );
          })}
        </div>
        <div style={{ display: 'flex', gap: 8 }}>
          <input value={newPlaylistName} onChange={e => setNewPlaylistName(e.target.value)} placeholder="New playlist name" style={{ flex: 1, background: theme.surface2, border: 'none', borderRadius: 10, padding: '9px 10px', color: theme.text, fontSize: 12.5, outline: 'none' }} onKeyDown={e => e.key === 'Enter' && createPlaylist(song.fingerprint)} />
          <button onClick={() => createPlaylist(song.fingerprint)} className="press" style={{ background: theme.accent, color: theme.bg, border: 'none', borderRadius: 10, padding: '0 14px', cursor: 'pointer', fontSize: 12.5, fontWeight: 700 }}>Create &amp; add</button>
        </div>
      </div>
    </div>
  );
}

/* ==========================================================================
   SECTION 9 — LYRICS VIEW
   ========================================================================== */

function LyricsView({ theme, currentSong, editingLyrics, setEditingLyrics, lyricsDraft, setLyricsDraft, saveLyrics, activeLyricIndex, lyricsScrollRef, activeLyricRef, seek, reducedMotion, tapSync, startTapSync, tapSyncNext, cancelTapSync }) {
  if (!currentSong) return <div style={{ color: theme.muted, fontSize: 13, textAlign: 'center', marginTop: 60 }}>Play a song to view its lyrics here.</div>;
  const ly = currentSong.lyrics;

  if (tapSync) {
    const progress = tapSync.idx / tapSync.lines.length;
    return (
      <div className="fade-up" style={{ marginTop: 12, display: 'flex', flexDirection: 'column', alignItems: 'center', textAlign: 'center' }}>
        <div style={{ fontSize: 11.5, color: theme.muted, marginBottom: 6 }}>Tap in time with the vocals — line {tapSync.idx + 1} of {tapSync.lines.length}</div>
        <div style={{ width: '100%', height: 4, borderRadius: 999, background: theme.surface, overflow: 'hidden', marginBottom: 22 }}>
          <div style={{ width: `${progress * 100}%`, height: '100%', background: theme.accent, transition: 'width 200ms ease' }} />
        </div>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 22, fontWeight: 600, lineHeight: 1.4, minHeight: 90, display: 'flex', alignItems: 'center', padding: '0 8px' }}>
          {tapSync.lines[tapSync.idx]}
        </div>
        {tapSync.idx + 1 < tapSync.lines.length && (
          <div style={{ fontSize: 12.5, color: theme.muted, marginTop: 8, fontStyle: 'italic' }}>Next: {tapSync.lines[tapSync.idx + 1]}</div>
        )}
        <button onClick={tapSyncNext} className="press" style={{ marginTop: 30, width: 120, height: 120, borderRadius: '50%', background: theme.accent, color: theme.bg, border: 'none', fontWeight: 800, fontSize: 15, cursor: 'pointer', display: 'flex', flexDirection: 'column', alignItems: 'center', justifyContent: 'center', gap: 6, boxShadow: '0 12px 30px -10px rgba(0,0,0,0.5)' }}>
          <Hand size={26} /> TAP
        </button>
        <button onClick={cancelTapSync} style={{ marginTop: 22, background: 'none', border: 'none', color: theme.muted, fontSize: 12.5, cursor: 'pointer' }}>Cancel sync</button>
      </div>
    );
  }

  if (editingLyrics || !ly) {
    return (
      <div className="fade-up" style={{ marginTop: 12 }}>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 18, fontWeight: 600, marginBottom: 4 }}>{currentSong.title}</div>
        <div style={{ fontSize: 12.5, color: theme.muted, marginBottom: 16 }}>{currentSong.artist}</div>
        <div style={{ fontSize: 12.5, color: theme.muted, marginBottom: 8, lineHeight: 1.5 }}>Paste plain lyrics, or use LRC-style timestamps like <code style={{ background: theme.surface, padding: '1px 5px', borderRadius: 4 }}>[00:12.50]</code> for a synced, karaoke-style view. No timestamps? Play the song and use <b>Tap to sync</b> below to generate them by ear.</div>
        <textarea value={lyricsDraft} onChange={e => setLyricsDraft(e.target.value)} placeholder={'[00:00.00] First line of the song\n[00:04.30] Second line...'} style={{ width: '100%', minHeight: 260, background: `${theme.surface}dd`, color: theme.text, border: `1px solid ${theme.surface2}`, borderRadius: 14, padding: 14, fontSize: 13.5, lineHeight: 1.7, resize: 'vertical', outline: 'none', fontFamily: 'inherit' }} />
        <div style={{ display: 'flex', gap: 8, marginTop: 12, flexWrap: 'wrap' }}>
          <button onClick={saveLyrics} className="press" style={{ background: theme.accent, color: theme.bg, border: 'none', borderRadius: 999, padding: '9px 20px', fontWeight: 700, fontSize: 13, cursor: 'pointer' }}>Save lyrics</button>
          <button onClick={startTapSync} className="press" style={{ background: theme.surface, color: theme.text, border: 'none', borderRadius: 999, padding: '9px 20px', fontWeight: 600, fontSize: 13, cursor: 'pointer', display: 'inline-flex', alignItems: 'center', gap: 6 }}><Hand size={14} /> Tap to sync</button>
          {ly && <button onClick={() => setEditingLyrics(false)} className="press" style={{ background: theme.surface, color: theme.text, border: 'none', borderRadius: 999, padding: '9px 20px', fontWeight: 600, fontSize: 13, cursor: 'pointer' }}>Cancel</button>}
        </div>
      </div>
    );
  }

  return (
    <div className="fade-up" style={{ display: 'flex', flexDirection: 'column', alignItems: 'center' }}>
      <div style={{ textAlign: 'center', marginTop: 8, marginBottom: 4 }}>
        <div style={{ fontFamily: "'Fraunces', serif", fontSize: 19, fontWeight: 600 }}>{currentSong.title}</div>
        <div style={{ fontSize: 12, color: theme.muted, marginTop: 2 }}>{currentSong.artist}{ly.synced ? ' · synced' : ''}</div>
      </div>
      <button onClick={() => setEditingLyrics(true)} style={{ background: 'none', border: 'none', color: theme.accent, fontSize: 11.5, cursor: 'pointer', marginBottom: 10 }}>Edit lyrics</button>
      <div ref={lyricsScrollRef} style={{ width: '100%', maxWidth: 380, textAlign: 'center', padding: '30vh 6px 30vh' }}>
        {ly.lines.map((line, i) => {
          const text = ly.synced ? line.text : line;
          const active = i === activeLyricIndex, isPast = i < activeLyricIndex;
          return (
            <div key={i} ref={active ? activeLyricRef : null} onClick={() => ly.synced && seek(line.time)} style={{ fontFamily: "'Fraunces', serif", fontSize: active ? 21 : 16.5, fontWeight: active ? 600 : 400, fontStyle: active ? 'normal' : 'italic', color: active ? theme.accent : isPast ? theme.muted : theme.text, opacity: active ? 1 : isPast ? 0.45 : 0.65, padding: '9px 4px', cursor: ly.synced ? 'pointer' : 'default', transition: reducedMotion ? 'none' : 'all 260ms ease', lineHeight: 1.5 }}>
              {text || '\u00A0'}
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ==========================================================================
   SECTION 9.5 — WEEKLY REPORT VIEW
   ========================================================================== */

function formatHM(totalSeconds) {
  const h = Math.floor(totalSeconds / 3600);
  const m = Math.round((totalSeconds % 3600) / 60);
  if (h > 0) return `${h}h ${m}m`;
  return `${m}m`;
}

function RatingBadge({ theme, rating }) {
  if (!rating) return null;
  const Icon = rating === 'up' ? ThumbsUp : ThumbsDown;
  return <Icon size={13} color={theme.accent} fill={theme.accent} style={{ flexShrink: 0 }} />;
}

function ReportView({ theme, skin, lastReport, songs, weekStart }) {
  const daysIn = Math.floor((Date.now() - weekStart) / (24 * 60 * 60 * 1000));
  const daysLeft = Math.max(0, 7 - daysIn);

  const liveTop = useMemo(() => {
    return [...songs].filter(s => (s.weekPlays || 0) > 0 || (s.weekSeconds || 0) > 0)
      .sort((a, b) => (b.weekPlays || 0) - (a.weekPlays || 0) || (b.weekSeconds || 0) - (a.weekSeconds || 0))
      .slice(0, 10);
  }, [songs]);
  const liveTotalPlays = useMemo(() => songs.reduce((sum, s) => sum + (s.weekPlays || 0), 0), [songs]);
  const liveTotalSeconds = useMemo(() => songs.reduce((sum, s) => sum + (s.weekSeconds || 0), 0), [songs]);

  const report = lastReport;

  return (
    <div className="fade-up" style={{ paddingTop: 8, paddingBottom: 10 }}>
      <SectionLabel theme={theme} icon={BarChart3} text="This week so far" />
      <div style={{ display: 'flex', gap: 8, marginBottom: 18 }}>
        <div className={skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined} style={{ flex: 1, background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`, borderRadius: 14, padding: '14px 12px', textAlign: 'center' }}>
          <div style={{ fontSize: 22, fontWeight: 800, color: theme.accent }}>{liveTotalPlays}</div>
          <div style={{ fontSize: 11, color: theme.muted, marginTop: 2 }}>total plays</div>
        </div>
        <div className={skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined} style={{ flex: 1, background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`, borderRadius: 14, padding: '14px 12px', textAlign: 'center' }}>
          <div style={{ fontSize: 22, fontWeight: 800, color: theme.accent }}>{formatHM(liveTotalSeconds)}</div>
          <div style={{ fontSize: 11, color: theme.muted, marginTop: 2 }}>time listened</div>
        </div>
        <div className={skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined} style={{ flex: 1, background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`, borderRadius: 14, padding: '14px 12px', textAlign: 'center' }}>
          <div style={{ fontSize: 22, fontWeight: 800, color: theme.accent }}>{daysLeft}</div>
          <div style={{ fontSize: 11, color: theme.muted, marginTop: 2 }}>day{daysLeft !== 1 ? 's' : ''} to full report</div>
        </div>
      </div>

      {liveTop.length === 0 ? (
        <div style={{ color: theme.muted, fontSize: 13, textAlign: 'center', padding: '20px 10px' }}>Nothing played yet this week — your top tracks will show up here.</div>
      ) : (
        <div style={{ display: 'flex', flexDirection: 'column', gap: 2, marginBottom: 22 }}>
          {liveTop.map((s, i) => (
            <div key={s.id} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 10px', borderRadius: 12 }}>
              <span style={{ fontSize: 12, color: theme.muted, width: 16, flexShrink: 0 }}>{i + 1}</span>
              <div style={{ flex: 1, minWidth: 0 }}>
                <div style={{ fontSize: 13, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.title}</div>
                <div style={{ fontSize: 11, color: theme.muted, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.artist} · {s.weekPlays || 0} play{(s.weekPlays || 0) !== 1 ? 's' : ''} · {formatHM(s.weekSeconds || 0)}</div>
              </div>
              <RatingBadge theme={theme} rating={s.rating} />
            </div>
          ))}
        </div>
      )}

      {report && (
        <>
          <SectionLabel theme={theme} icon={Clock} text="Last full report" />
          <div style={{ fontSize: 11.5, color: theme.muted, marginTop: -6, marginBottom: 10 }}>
            {new Date(report.periodStart).toLocaleDateString()} – {new Date(report.periodEnd).toLocaleDateString()}
          </div>
          <div style={{ display: 'flex', gap: 8, marginBottom: 14 }}>
            <div className={skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined} style={{ flex: 1, background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`, borderRadius: 14, padding: '12px', textAlign: 'center' }}>
              <div style={{ fontSize: 18, fontWeight: 800 }}>{report.totalPlays}</div>
              <div style={{ fontSize: 10.5, color: theme.muted }}>plays</div>
            </div>
            <div className={skin === 'glass' ? 'glasspanel-lite' : skin === 'neu' ? 'neupanel-lite' : undefined} style={{ flex: 1, background: skin === 'glass' ? undefined : skin === 'neu' ? 'var(--neu-bg)' : `${theme.surface}dd`, borderRadius: 14, padding: '12px', textAlign: 'center' }}>
              <div style={{ fontSize: 18, fontWeight: 800 }}>{formatHM(report.totalSeconds)}</div>
              <div style={{ fontSize: 10.5, color: theme.muted }}>listened</div>
            </div>
          </div>
          <div style={{ display: 'flex', flexDirection: 'column', gap: 2 }}>
            {report.songs.map((s, i) => (
              <div key={i} style={{ display: 'flex', alignItems: 'center', gap: 10, padding: '9px 10px', borderRadius: 12 }}>
                <span style={{ fontSize: 12, color: theme.muted, width: 16, flexShrink: 0 }}>{i + 1}</span>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontSize: 13, fontWeight: 600, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.title}</div>
                  <div style={{ fontSize: 11, color: theme.muted, whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>{s.artist} · {s.plays} play{s.plays !== 1 ? 's' : ''} · {formatHM(s.seconds)}</div>
                </div>
                <RatingBadge theme={theme} rating={s.rating} />
              </div>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

/* ==========================================================================
   SECTION 10 — SETTINGS VIEW

function SettingsView({
  theme, themeId, setThemeId, skin, setSkin, ambientEnabled, setAmbientEnabled, amoled, setAmoled,
  eq, setEq, preampDb, setPreampDb, crossfadeSeconds, setCrossfadeSeconds, speed, setSpeed,
  sleepMinutes, setSleepMinutes, sleepRemaining, reducedMotion, setReducedMotion, songCount,
  visualizerStyle, setVisualizerStyle,
  notificationsEnabled, requestNotifications, persistentStorageEnabled, requestPersistentStorage,
  backgroundPlaybackEnabled, setBackgroundPlaybackEnabled, openInfo,
}) {

function Row({ theme, skin, title, desc, children }) {

function App() {
  useEffect(() => {
    (async () => {
      try {
        if (window.Capacitor?.isNativePlatform?.()) {
          // Native plugins are reached through the auto-registered bridge
          // (window.Capacitor.Plugins), same pattern as native-media.js —
          // this build has no bundler, so bare ESM imports like
          // `import('@capacitor/splash-screen')` would fail silently here.
          const { SplashScreen, StatusBar } = window.Capacitor.Plugins;
          await StatusBar?.setStyle?.({ style: 'DARK' }).catch(() => {});
          await StatusBar?.setBackgroundColor?.({ color: '#121115' }).catch(() => {});
          setTimeout(() => SplashScreen?.hide?.().catch(() => {}), 400);
        }
      } catch {
        /* Not running inside Capacitor — fine, this is a plain web build. */
      }
    })();
  }, []);

  return (
    <PlayerErrorBoundary>
      <MusicPlayerApp />
    </PlayerErrorBoundary>
  );
}
